<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

if (!CORE.getCurrentUser()) location.href = 'index.html';

const canvas = document.getElementById('c3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050508);
scene.fog = new THREE.Fog(0x050508, 50, 150);

const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 500);
camera.position.set(20, 20, 20);

const controls = new OrbitControls(camera, canvas);
controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.ROTATE };
controls.enableDamping = true;
controls.maxDistance = 100;
controls.target.set(0, 0, 0);

scene.add(new THREE.AmbientLight(0x6a6a8a, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(25, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x7b2fbe, 0x0a0a10, 0.3));

const grid = new THREE.GridHelper(100, 100, 0x7b2fbe, 0x1a1a26);
grid.material.opacity = 0.6; grid.material.transparent = true;
scene.add(grid);

const selHelper = new THREE.BoxHelper(new THREE.Object3D(), 0xff2222);
selHelper.visible = false;
scene.add(selHelper);

let objects = [];
const meshMap = new Map();
let selected = null;
let currentTool = 'select';
let idCounter = 0;
let currentGameId = null;
let scriptContent = '';
let firstPerson = false;

const CHUNK_SIZE = CORE.CHUNK_SIZE;
function chunkKeyObj(o) { return CORE.chunkKey(o.position.x, o.position.y, o.position.z); }
function updateChunkHUD() {
  const groups = CORE.groupByChunk(objects);
  const n = Object.keys(groups).length;
  document.getElementById('vpHud').textContent = `${objects.length} obj · ${n} chunks (16³)`;
}

function buildMonsterMesh(data) {
  const g = new THREE.Group();
  const s = data.size || {x:2, y:4, z:2};
  const bodyMat = new THREE.MeshStandardMaterial({ color: data.color || '#444', roughness: 0.85 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(s.x*.4, s.x*.5, s.y*.6, 16), bodyMat);
  body.position.y = s.y*.3; body.castShadow = true; g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(s.x*.45, 20, 20), bodyMat);
  head.position.y = s.y*.75; head.castShadow = true; g.add(head);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 2 });
  const eL = new THREE.Mesh(new THREE.SphereGeometry(s.x*.08, 10, 10), eyeMat);
  eL.position.set(-s.x*.15, s.y*.78, s.x*.35); g.add(eL);
  const eR = eL.clone(); eR.position.x = s.x*.15; g.add(eR);
  return g;
}

function buildMesh(data) {
  if (!data.position) data.position = {x:0, y:0, z:0};
  if (!data.size) data.size = {x:1, y:1, z:1};
  if (data.type === 'Monster') { const g = buildMonsterMesh(data); g.position.set(data.position.x, data.position.y, data.position.z); return g; }
  let geom, mat;
  switch (data.type) {
    case 'Sphere': geom = new THREE.SphereGeometry(data.size.x/2, 20, 20); mat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.5 }); break;
    case 'Coin': geom = new THREE.SphereGeometry(data.size.x/2, 20, 20); mat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.4, emissive: new THREE.Color(data.color), emissiveIntensity: 0.6 }); break;
    case 'SpawnPoint': geom = new THREE.CylinderGeometry(data.size.x/2, data.size.x/2, data.size.y, 24); mat = new THREE.MeshStandardMaterial({ color: data.color, transparent: true, opacity: 0.55 }); break;
    case 'Goal': geom = new THREE.TorusGeometry(data.size.x/2, data.size.x*.15, 12, 32); mat = new THREE.MeshStandardMaterial({ color: data.color, emissive: new THREE.Color(data.color), emissiveIntensity: 0.9, metalness: 0.6 }); break;
    case 'KillBrick': geom = new THREE.BoxGeometry(data.size.x, data.size.y, data.size.z); mat = new THREE.MeshStandardMaterial({ color: '#ff2222', emissive: new THREE.Color(0xff0000), emissiveIntensity: 0.4 }); break;
    default: geom = new THREE.BoxGeometry(data.size.x, data.size.y, data.size.z); mat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.7 });
  }
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.set(data.position.x, data.position.y, data.position.z);
  mesh.castShadow = true; mesh.receiveShadow = true;
  mesh.matrixAutoUpdate = false;
  mesh.updateMatrix();
  return mesh;
}

function addObject(data) {
  if (!data.position) data.position = {x:0, y:0, z:0};
  if (!data.size) data.size = {x:1, y:1, z:1};
  objects.push(data);
  const mesh = buildMesh(data);
  mesh.userData.objectId = data.id;
  meshMap.set(data.id, mesh);
  scene.add(mesh);
  refreshExplorer();
  updateChunkHUD();
  return mesh;
}
function removeObjectById(id) {
  const idx = objects.findIndex(o => o.id === id);
  if (idx < 0) return;
  objects.splice(idx, 1);
  const mesh = meshMap.get(id);
  if (mesh) { scene.remove(mesh); meshMap.delete(id); }
  if (selected && selected.id === id) { selected = null; selHelper.visible = false; renderProps(); }
  refreshExplorer(); updateChunkHUD();
}
function updateMeshForData(data) {
  const old = meshMap.get(data.id);
  if (old) { scene.remove(old); meshMap.delete(data.id); }
  const mesh = buildMesh(data);
  mesh.userData.objectId = data.id;
  meshMap.set(data.id, mesh);
  scene.add(mesh);
  if (selected && selected.id === data.id) { selHelper.setFromObject(mesh); selHelper.visible = true; }
  updateChunkHUD();
}

document.querySelectorAll('.tool').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tool').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  currentTool = t.dataset.tool;
  document.getElementById('vpTool').textContent = t.querySelector('.lbl').textContent;
});

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
function updMouse(e) {
  const r = canvas.getBoundingClientRect();
  mouse.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  mouse.y = -((e.clientY - r.top) / r.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
}
function pickObj(e) {
  updMouse(e);
  const hits = raycaster.intersectObjects(Array.from(meshMap.values()), true);
  for (const hit of hits) {
    let obj = hit.object;
    while (obj && !obj.userData.objectId && obj.parent) obj = obj.parent;
    if (obj && obj.userData.objectId) return obj.userData.objectId;
  }
  return null;
}
function pickGround(e) {
  updMouse(e);
  const pt = new THREE.Vector3();
  return raycaster.ray.intersectPlane(groundPlane, pt) ? pt : null;
}

canvas.addEventListener('click', e => {
  if (e.button !== 0) return;
  if (currentTool === 'select') {
    const id = pickObj(e);
    if (id) selectObject(id);
    else { selected = null; selHelper.visible = false; renderProps(); refreshExplorer(); }
  } else if (currentTool === 'erase') {
    const id = pickObj(e);
    if (id) { removeObjectById(id); toast('Removido', true); }
  } else {
    const pt = pickGround(e);
    if (!pt) return;
    placeObject(currentTool, pt.x, pt.z);
  }
});

function placeObject(type, x, z) {
  let size, y, color, canCollide;
  switch (type) {
    case 'Part': size={x:4,y:1,z:4}; y=size.y/2; color='#4a4a5a'; canCollide=true; break;
    case 'Sphere': size={x:2,y:2,z:2}; y=size.y/2; color='#c07bd8'; canCollide=true; break;
    case 'SpawnPoint': size={x:2,y:0.2,z:2}; y=0.1; color='#3fa14b'; canCollide=false; break;
    case 'Coin': size={x:1.2,y:1.2,z:1.2}; y=1; color='#ff9ed0'; canCollide=false; break;
    case 'Monster': size={x:2,y:4,z:2}; y=size.y/2; color='#444444'; canCollide=false; break;
    case 'Goal': size={x:2,y:2,z:2}; y=2; color='#e8d347'; canCollide=false; break;
    case 'KillBrick': size={x:4,y:1,z:4}; y=size.y/2; color='#ff2222'; canCollide=true; break;
    default: return;
  }
  addObject({
    id: type.toLowerCase()+'_'+(++idCounter)+'_'+Date.now(),
    type, position:{x:Math.round(x*100)/100, y, z:Math.round(z*100)/100},
    size, color, canCollide, speed: type==='Monster'?2.5:undefined
  });
  toast(type+' adicionado', true);
}

function refreshExplorer() {
  const el = document.getElementById('explorer');
  if (!objects.length) { el.innerHTML = '<div style="color:var(--text-dim);font-style:italic;text-align:center;padding:16px;font-size:14px">Nenhum objeto.</div>'; return; }
  el.innerHTML = objects.map(o => `<div class="explorer-item ${selected&&selected.id===o.id?'selected':''}" data-id="${o.id}"><span class="cls">${o.type}</span>${o.id.slice(0,18)}</div>`).join('');
  el.querySelectorAll('.explorer-item').forEach(i => i.onclick = () => selectObject(i.dataset.id));
}
function selectObject(id) {
  selected = objects.find(o => o.id === id);
  if (!selected) return;
  const mesh = meshMap.get(id);
  if (mesh) { selHelper.setFromObject(mesh); selHelper.visible = true; }
  refreshExplorer(); renderProps();
}

function renderProps() {
  const el = document.getElementById('props');
  if (!selected) { el.innerHTML = '<div style="color:var(--text-dim);font-style:italic;text-align:center;padding:16px;font-size:14px">Selecione um objeto</div>'; return; }
  const o = selected;
  const ck = chunkKeyObj(o);
  el.innerHTML = `
    <div class="prop-group"><label>ID</label><div class="prop-single"><input value="${escapeHTML(o.id)}" readonly style="opacity:.5"></div></div>
    <div class="prop-group"><label>POSIÇÃO</label><div class="prop-row">
      <input type="number" id="pX" step="0.5" value="${(o.position?.x||0).toFixed(2)}">
      <input type="number" id="pY" step="0.5" value="${(o.position?.y||0).toFixed(2)}">
      <input type="number" id="pZ" step="0.5" value="${(o.position?.z||0).toFixed(2)}">
    </div></div>
    <div class="prop-group"><label>TAMANHO</label><div class="prop-row">
      <input type="number" id="pSX" step="0.5" min="0.1" value="${(o.size?.x||1).toFixed(2)}">
      <input type="number" id="pSY" step="0.5" min="0.1" value="${(o.size?.y||1).toFixed(2)}">
      <input type="number" id="pSZ" step="0.5" min="0.1" value="${(o.size?.z||1).toFixed(2)}">
    </div></div>
    <div class="prop-group"><label>COR</label><div class="prop-single"><input type="color" id="pColor" value="${o.color||'#888888'}"></div></div>
    ${o.type==='Monster'?`<div class="prop-group"><label>SPEED</label><div class="prop-single"><input type="number" id="pSpeed" step="0.1" min="0" value="${(o.speed||2).toFixed(1)}"></div></div>`:''}
    <div class="prop-group"><label class="prop-check"><input type="checkbox" id="pCollide" ${o.canCollide?'checked':''}> CanCollide</label></div>
    <span class="chunk-tag">📦 chunk ${ck}</span>
    <div class="prop-actions">
      <button class="btn" id="pDel">🗑 DELETAR</button>
      <button class="btn" id="pClone">📋 DUPLICAR</button>
    </div>
  `;
  const updPos = () => {
    if (!o.position) o.position = {x:0, y:0, z:0};
    o.position.x = parseFloat(document.getElementById('pX').value) || 0;
    o.position.y = parseFloat(document.getElementById('pY').value) || 0;
    o.position.z = parseFloat(document.getElementById('pZ').value) || 0;
    const m = meshMap.get(o.id); if (m) { m.position.set(o.position.x, o.position.y, o.position.z); m.updateMatrix(); selHelper.setFromObject(m); }
    updateChunkHUD();
  };
  const updSize = () => {
    if (!o.size) o.size = {x:1, y:1, z:1};
    o.size.x = Math.max(0.1, parseFloat(document.getElementById('pSX').value)||1);
    o.size.y = Math.max(0.1, parseFloat(document.getElementById('pSY').value)||1);
    o.size.z = Math.max(0.1, parseFloat(document.getElementById('pSZ').value)||1);
    updateMeshForData(o);
  };
  ['pX','pY','pZ'].forEach(id => document.getElementById(id).oninput = updPos);
  ['pSX','pSY','pSZ'].forEach(id => document.getElementById(id).oninput = updSize);
  document.getElementById('pColor').oninput = e => { o.color = e.target.value; updateMeshForData(o); };
  const pS = document.getElementById('pSpeed'); if (pS) pS.oninput = e => { o.speed = parseFloat(e.target.value)||2; };
  document.getElementById('pCollide').onchange = e => { o.canCollide = e.target.checked; };
  document.getElementById('pDel').onclick = () => { removeObjectById(o.id); toast('Deletado', true); };
  document.getElementById('pClone').onclick = () => {
    const c = JSON.parse(JSON.stringify(o));
    c.id = c.type.toLowerCase()+'_'+(++idCounter)+'_'+Date.now();
    c.position.x += 3;
    addObject(c); toast('Duplicado', true);
  };
}
function escapeHTML(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function loadStarter() {
  objects.forEach(o => { const m = meshMap.get(o.id); if (m) scene.remove(m); });
  objects = []; meshMap.clear(); selected = null; selHelper.visible = false; idCounter = 0;
  addObject({ id:'floor_1', type:'Part', position:{x:0,y:-0.25,z:0}, size:{x:40,y:0.5,z:40}, color:'#2a2a3a', canCollide:true });
  addObject({ id:'spawn_1', type:'SpawnPoint', position:{x:0,y:0.1,z:0}, size:{x:2,y:0.2,z:2}, color:'#3fa14b', canCollide:false });
  refreshExplorer(); renderProps(); updateChunkHUD();
}

const params = new URLSearchParams(location.search);
const loadId = params.get('game');
if (loadId) {
  const g = CORE.getGame(loadId);
  if (g && g.authorId === CORE.getSession()) {
    currentGameId = g.id;
    document.getElementById('gname').value = g.name;
    scriptContent = g.script || '';
    (g.objects || []).forEach(o => addObject(o));
    refreshExplorer();
    toast('Carregado: '+g.name, true);
  } else loadStarter();
} else loadStarter();

document.getElementById('newBtn').onclick = () => {
  if (!confirm('Novo jogo? O atual será perdido.')) return;
  currentGameId = null;
  document.getElementById('gname').value = '';
  scriptContent = '';
  loadStarter();
  toast('Novo jogo', true);
};
document.getElementById('scriptBtn').onclick = () => {
  document.getElementById('scriptEditor').value = scriptContent;
  document.getElementById('scriptModal').classList.add('show');
};
document.getElementById('scriptSave').onclick = () => {
  scriptContent = document.getElementById('scriptEditor').value;
  document.getElementById('scriptModal').classList.remove('show');
  toast('Script salvo', true);
};
document.getElementById('testBtn').onclick = () => {
  const name = document.getElementById('gname').value.trim() || 'Teste';
  sessionStorage.setItem('cb_test_game', JSON.stringify({ id:'test', name, objects: JSON.parse(JSON.stringify(objects)), script: scriptContent }));
  document.getElementById('testFrame').src = 'engine.html?test=1';
  document.getElementById('testModal').classList.add('show');
  
  // FOCO NO IFRAME: Isso permite que o teclado funcione no jogo!
  setTimeout(() => {
    const iframe = document.getElementById('testFrame');
    if (iframe && iframe.contentWindow) iframe.contentWindow.focus();
  }, 500);
};
document.getElementById('testClose').onclick = () => {
  document.getElementById('testFrame').src = 'about:blank';
  document.getElementById('testModal').classList.remove('show');
};
document.getElementById('pubBtn').onclick = () => {
  const name = document.getElementById('gname').value.trim();
  if (!name) { toast('Digite um nome', false); return; }
  if (!objects.some(o => o.type === 'SpawnPoint')) { toast('Adicione 1 SpawnPoint', false); return; }
  const hasGoal = objects.some(o => o.type === 'Goal');
  const hasCoin = objects.some(o => o.type === 'Coin');
  if (!hasGoal && !hasCoin) { toast('Adicione 1 Coin ou 1 Goal', false); return; }
  const r = CORE.publishGame({ id: currentGameId, name, objects: JSON.parse(JSON.stringify(objects)), script: scriptContent });
  if (!r.ok) { toast(r.error, false); return; }
  currentGameId = r.game.id;
  toast('Publicado!', true);
  setTimeout(() => location.href = 'index.html', 900);
};

window.addEventListener('keydown', e => {
  if (e.key.toLowerCase() === 'v') {
    firstPerson = !firstPerson;
    if (firstPerson) {
      camera.position.set(0, 3, 0);
      controls.target.set(0, 3, -5);
      toast('Câmera 1ª pessoa', true);
    } else {
      camera.position.set(20, 20, 20);
      controls.target.set(0, 0, 0);
      toast('Câmera 3ª pessoa', true);
    }
  }
});

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
setTimeout(resize, 100);
let tick = 0;
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  if (selected && meshMap.get(selected.id) && (tick++ % 4) === 0) selHelper.setFromObject(meshMap.get(selected.id));
  renderer.render(scene, camera);
}
animate();
</script>
</body></html>
