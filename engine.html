<title>V-01 Engine — CustardBricks 3D</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<script type="importmap">
{"imports":{"three": "https://unpkg.com/three@0.160.0/build/three.module.js"}}
</script>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;color:#d8d0e0;font-family:'VT323',monospace;font-size:18px}
  canvas#c3d{display:block}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.9) 100%);z-index:9000}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.03) 0,rgba(255,255,255,.03) 1px,transparent 1px,transparent 3px);z-index:9001;mix-blend-mode:overlay;animation:fl .15s infinite}
  @keyframes fl{0%{opacity:.9}50%{opacity:1}100%{opacity:.85}}

  .static{position:fixed;inset:0;pointer-events:none;z-index:9500;opacity:0;background-image:repeating-radial-gradient(circle at 30% 40%,rgba(255,255,255,.08) 0,transparent 2px),repeating-radial-gradient(circle at 70% 60%,rgba(255,255,255,.05) 0,transparent 3px);background-size:4px 4px,6px 6px;animation:sm .12s steps(3) infinite;mix-blend-mode:screen;transition:opacity .2s}
  @keyframes sm{0%{background-position:0 0,0 0}33%{background-position:2px 1px,-1px 2px}66%{background-position:-1px 2px,2px -1px}100%{background-position:1px -1px,-2px 1px}}

  .jump{position:fixed;inset:0;background:#f00;opacity:0;pointer-events:none;z-index:9800;transition:opacity .05s}
  .jump.flash{opacity:.85}

  .hud{position:fixed;inset:0;pointer-events:none;z-index:100;padding:14px 20px}
  .hud-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .hud-box{background:rgba(10,10,16,.8);border:2px solid #2a2a3a;padding:5px 14px;font-size:20px;letter-spacing:1px;text-shadow:0 0 6px #000}
  .hud-title{color:#7b2fbe}
  .hud-score{color:#ff9ed0}
  .hud-dist{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(10,10,16,.85);border:2px solid #2a2a3a;padding:4px 16px;font-size:18px;letter-spacing:2px;color:#8a839a}
  .hud-dist.safe{color:#3fa14b}
  .hud-dist.danger{color:#ff2222;animation:pulse .4s infinite alternate}
  @keyframes pulse{from{opacity:.7}to{opacity:1}}
  .hud-esc{position:fixed;bottom:20px;left:20px;color:#4a4a5a;font-size:14px;letter-spacing:2px;z-index:100;pointer-events:none}
  .hud-brand{position:fixed;bottom:20px;right:20px;color:#4a4a5a;font-size:14px;letter-spacing:2px;z-index:100;pointer-events:none}

  .overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:rgba(0,0,0,.9);z-index:5000;text-align:center;padding:20px}
  .overlay.show{display:flex;animation:fadeIn .3s}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .overlay h1{font-size:64px;letter-spacing:4px;margin:0}
  .overlay.lose h1{color:#ff2222;text-shadow:0 0 20px #ff2222;animation:shake .5s infinite}
  @keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-2px)}}
  .overlay.win h1{color:#e8d347;text-shadow:0 0 20px #e8d347}
  .overlay p{font-size:22px;color:#8a839a;max-width:560px;margin:0}
  .overlay .reward{font-size:34px;color:#ff9ed0;text-shadow:0 0 12px #b03a78}
  .overlay .btn{font-family:'VT323',monospace;font-size:24px;padding:10px 28px;background:#12121c;color:#d8d0e0;border:2px solid #ff2222;cursor:pointer;letter-spacing:2px;transition:.15s}
  .overlay .btn:hover{background:#a01515;box-shadow:0 0 18px #ff2222}

  .hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:4000;background:rgba(10,10,16,.95);border:2px solid #ff2222;padding:24px 32px;text-align:center;box-shadow:0 0 40px rgba(255,34,34,.5);transition:opacity .4s}
  .hint.hidden{opacity:0;pointer-events:none}
  .hint h2{color:#ff2222;margin:0 0 10px;letter-spacing:3px}
  .hint p{margin:4px 0;color:#8a839a}
  .hint .key{display:inline-block;padding:2px 8px;border:1px solid #2a2a3a;background:#06060a;color:#d8d0e0;margin:0 2px;font-size:18px}
  .hint b{color:#ff2222}
</style>

<script src="core.js"></script>
<script type="module">
import * as THREE from 'three';

/* =========================================================
   Bootstrap
========================================================= */
const Core = window.CORE;
const params = new URLSearchParams(location.search);
const isTest = params.get('test') === '1';

let game;
if (isTest) {
  try { game = JSON.parse(sessionStorage.getItem('cb_test_game') || 'null'); }
  catch (e) { game = null; }
  if (!game) { alert('Nenhum jogo de teste'); location.href = 'index.html'; }
} else {
  if (!Core.getCurrentUser()) { location.href = 'index.html'; }
  game = Core.getSelectedGame();
  if (!game) { alert('Nenhum jogo selecionado'); location.href = 'index.html'; }
  Core.incrementPlays(game.id);
}

const avatar = Core.getCurrentUser() ? Core.getAvatar() : { body: 'body_purple' };
const bodyColor = (Core.getMarketItem && Core.getMarketItem(avatar.body)?.color) || '#7b2fbe';

/* =========================================================
   Three.js base
========================================================= */
const canvas = document.getElementById('c3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050508);
scene.fog = new THREE.Fog(0x050508, 30, 100);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);

scene.add(new THREE.AmbientLight(0x6a6a8a, 0.65));
const sun = new THREE.DirectionalLight(0xffffff, 1.1);
sun.position.set(20, 35, 15);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -60;
sun.shadow.camera.far = 150;
scene.add(sun);
scene.add(new THREE.HemisphereLight(0x7b2fbe, 0x0a0a10, 0.35));

function resize() {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
resize();
window.addEventListener('resize', resize);

/* =========================================================
   Mesh builders
========================================================= */
function buildMonsterMesh(data) {
  const g = new THREE.Group();
  const s = data.size;
  const bodyMat = new THREE.MeshStandardMaterial({ color: data.color || '#444', roughness: 0.85 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(s.x * 0.4, s.x * 0.5, s.y * 0.6, 16), bodyMat);
  body.position.y = s.y * 0.3; body.castShadow = true;
  g.add(body);
  const head = new THREE.Mesh(new THREE.SphereGeometry(s.x * 0.45, 20, 20), bodyMat);
  head.position.y = s.y * 0.75; head.castShadow = true;
  g.add(head);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 3 });
  const eL = new THREE.Mesh(new THREE.SphereGeometry(s.x * 0.08, 10, 10), eyeMat);
  eL.position.set(-s.x * 0.15, s.y * 0.78, s.x * 0.35);
  g.add(eL);
  const eR = eL.clone(); eR.position.x = s.x * 0.15; g.add(eR);
  return g;
}

function buildMesh(data) {
  if (data.type === 'Monster') {
    const g = buildMonsterMesh(data);
    g.position.set(data.position.x, data.position.y, data.position.z);
    g.userData.ref = data;
    return g;
  }
  let geom, mat;
  switch (data.type) {
    case 'Sphere':
      geom = new THREE.SphereGeometry(data.size.x / 2, 20, 20);
      mat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.5 });
      break;
    case 'Coin':
      geom = new THREE.SphereGeometry(data.size.x / 2, 20, 20);
      mat = new THREE.MeshStandardMaterial({
        color: data.color, roughness: 0.4,
        emissive: new THREE.Color(data.color), emissiveIntensity: 0.7
      });
      break;
    case 'SpawnPoint':
      geom = new THREE.CylinderGeometry(data.size.x / 2, data.size.x / 2, data.size.y, 24);
      mat = new THREE.MeshStandardMaterial({ color: data.color, transparent: true, opacity: 0.4 });
      break;
    case 'Goal':
      geom = new THREE.TorusGeometry(data.size.x / 2, data.size.x * 0.18, 12, 32);
      mat = new THREE.MeshStandardMaterial({
        color: data.color, emissive: new THREE.Color(data.color),
        emissiveIntensity: 1, metalness: 0.7, roughness: 0.3
      });
      break;
    case 'KillBrick':
      geom = new THREE.BoxGeometry(data.size.x, data.size.y, data.size.z);
      mat = new THREE.MeshStandardMaterial({
        color: '#ff2222', emissive: new THREE.Color(0xff0000), emissiveIntensity: 0.5
      });
      break;
    default:
      geom = new THREE.BoxGeometry(data.size.x, data.size.y, data.size.z);
      mat = new THREE.MeshStandardMaterial({ color: data.color, roughness: 0.7 });
  }
  const mesh = new THREE.Mesh(geom, mat);
  mesh.position.set(data.position.x, data.position.y, data.position.z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData.ref = data;
  return mesh;
}

/* =========================================================
   Build world
========================================================= */
const workspace = [];
const meshMap = new Map();
const coins = [];
const monsters = [];
const goals = [];
const killers = [];
const solids = [];

function addObject(data) {
  workspace.push(data);
  const mesh = buildMesh(data);
  scene.add(mesh);
  meshMap.set(data.id, mesh);
  if (data.type === 'Coin') coins.push({ data, mesh, collected: false, baseY: data.position.y });
  else if (data.type === 'Monster') monsters.push({ data, mesh, speed: data.speed || 2 });
  else if (data.type === 'Goal') goals.push({ data, mesh });
  else if (data.type === 'KillBrick') killers.push({ data, mesh });
  else if (data.type === 'Part' || data.type === 'Sphere') {
    if (data.canCollide) solids.push(data);
  }
  return mesh;
}

(game.objects || []).forEach(o => addObject(o));

/* =========================================================
   Player
========================================================= */
const playerSpawnData = workspace.find(o => o.type === 'SpawnPoint');
const spawnPos = playerSpawnData ? playerSpawnData.position : { x: 0, y: 0, z: 0 };

const playerMesh = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.5, 1.2, 6, 12),
  new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.5, emissive: new THREE.Color(bodyColor), emissiveIntensity: 0.15 })
);
playerMesh.castShadow = true;
scene.add(playerMesh);

const player = {
  pos: new THREE.Vector3(spawnPos.x, 0, spawnPos.z),
  radius: 0.5,
  height: 2,
  speed: 7
};
playerMesh.position.copy(player.pos);

/* =========================================================
   State
========================================================= */
let state = 'waiting';
const keys = {};
let lastTime = 0;
let score = 0;
const totalCoins = coins.length;
const hasGoal = goals.length > 0;
let nearestMonster = Infinity;

/* =========================================================
   HUD
========================================================= */
const hud = document.getElementById('hud');
const hGame = document.getElementById('hGame');
const hScore = document.getElementById('hScore');
const hTotal = document.getElementById('hTotal');
const hDist = document.getElementById('hDist');
const hEsc = document.getElementById('hEsc');
const hintEl = document.getElementById('hint');
const hintExtra = document.getElementById('hintExtra');
const staticEl = document.getElementById('static');
const jumpEl = document.getElementById('jump');
const overlay = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovMsg = document.getElementById('ovMsg');
const ovReward = document.getElementById('ovReward');
const ovBtn = document.getElementById('ovBtn');

hGame.textContent = (game.name || 'V-01').slice(0, 30);
hTotal.textContent = totalCoins;

if (totalCoins === 0 && !hasGoal) hintExtra.textContent = 'Sem objetivo — explore livremente. Pressione uma tecla.';
else if (hasGoal) hintExtra.textContent = 'Encontre a ★ Meta. Pressione uma tecla.';
else hintExtra.textContent = 'Colete todos os custards. Pressione uma tecla.';

ovBtn.addEventListener('click', () => {
  if (isTest) location.href = 'studio.html';
  else location.href = 'index.html';
});

/* =========================================================
   Input
========================================================= */
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) e.preventDefault();
  keys[k] = true;
  if (state === 'waiting') startGame();
  if (k === 'escape' && state !== 'waiting') {
    if (isTest) location.href = 'studio.html';
    else location.href = 'index.html';
  }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function startGame() {
  state = 'playing';
  hintEl.classList.add('hidden');
  hud.style.display = 'block';
  hDist.style.display = 'block';
  hEsc.style.display = 'block';
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

/* =========================================================
   Collision (AABB XZ with Y band)
========================================================= */
function wouldCollide(x, z) {
  const pMinY = 0.1, pMaxY = 1.9;
  const half = player.radius;
  for (const obj of solids) {
    const s = obj.size;
    const p = obj.position;
    const minY = p.y - s.y / 2, maxY = p.y + s.y / 2;
    if (maxY <= pMinY || minY >= pMaxY) continue;
    const minX = p.x - s.x / 2, maxX = p.x + s.x / 2;
    const minZ = p.z - s.z / 2, maxZ = p.z + s.z / 2;
    if (x + half > minX && x - half < maxX && z + half > minZ && z - half < maxZ) return true;
  }
  return false;
}

/* =========================================================
   Update
========================================================= */
function updatePlayer(dt) {
  let dx = 0, dz = 0;
  if (keys['w'] || keys['arrowup'])    dz -= 1;
  if (keys['s'] || keys['arrowdown'])  dz += 1;
  if (keys['a'] || keys['arrowleft'])  dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (dx || dz) {
    const len = Math.hypot(dx, dz);
    dx /= len; dz /= len;
    const step = player.speed * dt;
    const nx = player.pos.x + dx * step;
    if (!wouldCollide(nx, player.pos.z)) player.pos.x = nx;
    const nz = player.pos.z + dz * step;
    if (!wouldCollide(player.pos.x, nz)) player.pos.z = nz;
    playerMesh.rotation.y = Math.atan2(dx, dz);
  }
  playerMesh.position.set(player.pos.x, player.height / 2, player.pos.z);
}

function updateMonsters(dt) {
  nearestMonster = Infinity;
  for (const m of monsters) {
    const dir = new THREE.Vector3().subVectors(player.pos, m.mesh.position);
    dir.y = 0;
    const dist = dir.length();
    if (dist < nearestMonster) nearestMonster = dist;
    if (dist > 0.1) {
      dir.normalize();
      const step = m.speed * dt;
      // Try to move toward player, sliding against walls
      const nx = m.mesh.position.x + dir.x * step;
      const nz = m.mesh.position.z + dir.z * step;
      let moved = false;
      if (!wouldCollide(nx, m.mesh.position.z)) { m.mesh.position.x = nx; moved = true; }
      if (!wouldCollide(m.mesh.position.x, nz)) { m.mesh.position.z = nz; moved = true; }
      if (!moved) {
        // Slide perpendicular
        const px = m.mesh.position.x - dir.z * step;
        const pz = m.mesh.position.z + dir.x * step;
        if (!wouldCollide(px, m.mesh.position.z)) m.mesh.position.x = px;
        if (!wouldCollide(m.mesh.position.x, pz)) m.mesh.position.z = pz;
      }
      m.mesh.rotation.y = Math.atan2(dir.x, dir.z);
    }
    // Kill on contact
    if (dist < 1.3) { triggerLose(); return; }
  }
}

function updateCoins(dt) {
  const t = performance.now() * 0.001;
  for (const c of coins) {
    if (c.collected) continue;
    c.mesh.position.y = c.baseY + Math.sin(t * 2.5 + c.mesh.position.x) * 0.15;
    c.mesh.rotation.y += dt * 2;
    const dx = c.mesh.position.x - player.pos.x;
    const dz = c.mesh.position.z - player.pos.z;
    const dy = c.mesh.position.y - (player.pos.y + 1);
    if (Math.hypot(dx, dz) < 1.2 && Math.abs(dy) < 1.5) {
      c.collected = true;
      c.mesh.visible = false;
      scene.remove(c.mesh);
      score++;
      hScore.textContent = score;
      if (!hasGoal && totalCoins > 0 && score >= totalCoins) triggerWin();
    }
  }
}

function updateKillers() {
  for (const k of killers) {
    const dx = k.mesh.position.x - player.pos.x;
    const dz = k.mesh.position.z - player.pos.z;
    const halfX = k.data.size.x / 2 + player.radius;
    const halfZ = k.data.size.z / 2 + player.radius;
    if (Math.abs(dx) < halfX && Math.abs(dz) < halfZ) {
      const pMinY = 0.1, pMaxY = 1.9;
      const minY = k.data.position.y - k.data.size.y / 2;
      const maxY = k.data.position.y + k.data.size.y / 2;
      if (maxY > pMinY && minY < pMaxY) { triggerLose(); return; }
    }
  }
  for (const g of goals) {
    const dx = g.mesh.position.x - player.pos.x;
    const dz = g.mesh.position.z - player.pos.z;
    if (Math.hypot(dx, dz) < 2) { triggerWin(); return; }
  }
}

function updateAtmosphere() {
  if (monsters.length === 0 || nearestMonster === Infinity) {
    staticEl.style.opacity = '0';
    hDist.textContent = '—';
    hDist.className = 'hud-dist';
    return;
  }
  const d = nearestMonster;
  if (d < 15) staticEl.style.opacity = Math.min(0.8, (15 - d) / 15).toFixed(2);
  else staticEl.style.opacity = '0';
  hDist.textContent = 'DISTÂNCIA: ' + d.toFixed(1) + 'm';
  hDist.className = 'hud-dist';
  if (d < 6) hDist.classList.add('danger');
  else if (d > 15) hDist.classList.add('safe');
}

/* =========================================================
   Camera
========================================================= */
const camOffset = new THREE.Vector3(0, 10, 12);
function updateCamera(dt) {
  const target = new THREE.Vector3(player.pos.x, 2, player.pos.z).add(camOffset);
  const k = Math.min(1, dt * 6);
  camera.position.lerp(target, k);
  camera.lookAt(player.pos.x, 1.2, player.pos.z);
}
camera.position.set(spawnPos.x, 10, spawnPos.z + 12);
camera.lookAt(spawnPos.x, 1, spawnPos.z);

/* =========================================================
   Script execution (optional)
========================================================= */
function executeScript() {
  if (!game.script || !game.script.trim()) return;

  const V3 = { new: (x = 0, y = 0, z = 0) => ({ x, y, z }) };
  const C3 = {
    fromRGB: (r = 0, g = 0, b = 0) => '#' + [r,g,b].map(c => Math.max(0,Math.min(255,Math.round(c))).toString(16).padStart(2,'0')).join(''),
    new: (r = 0, g = 0, b = 0) => C3.fromRGB(r*255, g*255, b*255)
  };

  const InstanceAPI = {
    new: (type) => {
      const data = {
        id: 'dyn_' + Math.random().toString(36).slice(2, 10),
        type, position: { x: 0, y: 0, z: 0 }, size: { x: 1, y: 1, z: 1 },
        color: type === 'Coin' ? '#ff9ed0' : type === 'Monster' ? '#444' : type === 'Goal' ? '#e8d347' : type === 'KillBrick' ? '#ff2222' : type === 'SpawnPoint' ? '#3fa14b' : '#888',
        canCollide: type === 'Part' || type === 'Sphere' || type === 'KillBrick',
        speed: 2.5
      };
      const inst = {
        ClassName: type,
        _data: data,
        get Position() { return data.position; },
        set Position(v) { data.position = v; const m = meshMap.get(data.id); if (m) m.position.set(v.x, v.y, v.z); },
        get Size() { return data.size; },
        set Size(v) { data.size = v; const m = meshMap.get(data.id); if (m) { scene.remove(m); } meshMap.delete(data.id); const nm = buildMesh(data); nm.userData.ref = data; scene.add(nm); meshMap.set(data.id, nm); },
        set Color(v) { data.color = v; const m = meshMap.get(data.id); if (m) m.traverse ? m.traverse(c => { if (c.isMesh && c.material.color) c.material.color.set(v); }) : m.material.color.set(v); },
        set Speed(v) { data.speed = v; },
        set Parent(p) {
          if (p === workspace) {
            addObject(data);
          }
        }
      };
      return inst;
    }
  };

  const playerAPI = {
    Kill: () => triggerLose(),
    ClassName: 'Player'
  };

  const gameAPI = {
    Workspace: workspace,
    Players: { LocalPlayer: playerAPI }
  };

  try {
    const fn = new Function('Vector3', 'Color3', 'Instance', 'game', 'print', 'workspace', game.script);
    fn(V3, C3, InstanceAPI, gameAPI, (...a) => console.log('[V-01]', ...a), workspace);
  } catch (e) {
    console.error('Script error:', e);
  }
}

executeScript();

/* =========================================================
   Main loop
========================================================= */
function loop(timestamp) {
  if (state !== 'playing') return;
  if (!lastTime) lastTime = timestamp;
  const dt = Math.min(0.05, (timestamp - lastTime) / 1000);
  lastTime = timestamp;

  updatePlayer(dt);
  updateMonsters(dt);
  if (state !== 'playing') return;
  updateCoins(dt);
  if (state !== 'playing') return;
  updateKillers();
  if (state !== 'playing') return;
  updateAtmosphere();
  updateCamera(dt);

  renderer.render(scene, camera);

  if (state === 'playing') requestAnimationFrame(loop);
}

/* =========================================================
   End states
========================================================= */
function triggerLose() {
  if (state !== 'playing') return;
  state = 'lost';
  jumpEl.classList.add('flash');
  setTimeout(() => jumpEl.classList.remove('flash'), 100);
  setTimeout(() => jumpEl.classList.add('flash'), 180);
  setTimeout(() => jumpEl.classList.remove('flash'), 260);
  setTimeout(() => {
    overlay.className = 'overlay lose show';
    ovTitle.textContent = 'VOCÊ MORREU';
    ovMsg.textContent = 'O Slendytubby te encontrou...';
    ovReward.textContent = '';
  }, 500);
}

function triggerWin() {
  if (state !== 'playing') return;
  state = 'won';
  const reward = score;
  if (!isTest && reward > 0) Core.addCustards(reward, 'game:' + game.id);
  overlay.className = 'overlay win show';
  ovTitle.textContent = 'VOCÊ VENCEU';
  ovMsg.textContent = 'Objetivos concluídos. Bom trabalho, sobrevivente.';
  if (isTest) ovReward.textContent = '(modo teste — sem recompensa)';
  else ovReward.textContent = reward > 0 ? '+' + reward + ' Custards salvos!' : 'Sem custards coletados';
}

/* =========================================================
   Initial render
========================================================= */
renderer.render(scene, camera);
</script>
</body>
