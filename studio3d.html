<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CustardBricks 3D — Gameplay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #000; color: #d8d0e0;
    font-family: 'VT323', monospace; font-size: 20px;
  }
  canvas#gameCanvas { display: block; }

  /* Vinheta + Scanlines CRT */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.9) 100%);
    z-index: 9000;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.03) 0px,
      rgba(255,255,255,0.03) 1px,
      transparent 1px, transparent 3px
    );
    z-index: 9001; mix-blend-mode: overlay;
    animation: flicker 0.15s infinite;
  }
  @keyframes flicker { 0%{opacity:.9}50%{opacity:1}100%{opacity:.85} }

  /* Static overlay — intensifica perto do monstro */
  .static-overlay {
    position: fixed; inset: 0; pointer-events: none;
    z-index: 9500; opacity: 0;
    background-image:
      repeating-radial-gradient(circle at 30% 40%, rgba(255,255,255,0.08) 0, transparent 2px),
      repeating-radial-gradient(circle at 70% 60%, rgba(255,255,255,0.05) 0, transparent 3px);
    background-size: 4px 4px, 6px 6px;
    animation: staticMove 0.12s steps(3) infinite;
    mix-blend-mode: screen;
    transition: opacity 0.2s;
  }
  @keyframes staticMove {
    0%   { background-position: 0 0, 0 0; }
    33%  { background-position: 2px 1px, -1px 2px; }
    66%  { background-position: -1px 2px, 2px -1px; }
    100% { background-position: 1px -1px, -2px 1px; }
  }

  /* Jumpscare flash */
  .jumpscare {
    position: fixed; inset: 0; background: #ff0000;
    opacity: 0; pointer-events: none; z-index: 9800;
    transition: opacity 0.05s;
  }
  .jumpscare.flash { opacity: 0.88; }

  /* HUD */
  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 100; padding: 16px 22px; }
  .hud-top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .hud-box {
    background: rgba(10,10,16,0.7); border: 2px solid #2a2a3a;
    padding: 6px 14px; letter-spacing: 1px;
    text-shadow: 0 0 6px #000;
  }
  .hud-game { color: #7b2fbe; }
  .hud-custards { color: #ff9ed0; }
  .hud-dist {
    position: fixed; bottom: 22px; left: 50%;
    transform: translateX(-50%);
    background: rgba(10,10,16,0.8); border: 2px solid #2a2a3a;
    padding: 6px 18px; letter-spacing: 2px;
    text-shadow: 0 0 6px #000;
  }
  .hud-dist.safe { color: #3fa14b; text-shadow: 0 0 8px #1a5f24; }
  .hud-dist.danger { color: #ff2222; text-shadow: 0 0 10px #a01515; animation: pulse 0.4s infinite alternate; }
  .hud-dist.off { color: #8a839a; }
  @keyframes pulse { from{opacity:.7}to{opacity:1} }

  /* Overlays resultado */
  .overlay {
    position: fixed; inset: 0;
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    background: rgba(0,0,0,0.9);
    z-index: 5000; text-align: center; padding: 20px;
  }
  .overlay.show { display: flex; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from{opacity:0}to{opacity:1} }
  .overlay h1 { font-size: 64px; letter-spacing: 4px; margin: 0; }
  .overlay.lose h1 {
    color: #ff2222;
    text-shadow: 0 0 20px #ff2222, 0 0 40px #a01515;
    animation: shake 0.5s infinite;
  }
  @keyframes shake {
    0%,100%{transform:translate(0,0)}
    25%{transform:translate(-3px,2px)}
    50%{transform:translate(3px,-2px)}
    75%{transform:translate(-2px,-2px)}
  }
  .overlay.win h1 { color: #e8d347; text-shadow: 0 0 20px #e8d347, 0 0 40px #a07a10; }
  .overlay p { font-size: 22px; color: #8a839a; max-width: 560px; margin: 0; }
  .overlay .reward { font-size: 36px; color: #ff9ed0; text-shadow: 0 0 12px #b03a78; }
  .overlay .btn {
    font-family: 'VT323', monospace; font-size: 24px;
    padding: 10px 28px; background: #12121c; color: #d8d0e0;
    border: 2px solid #ff2222; cursor: pointer; letter-spacing: 2px;
    transition: all 0.15s;
  }
  .overlay .btn:hover { background: #a01515; box-shadow: 0 0 18px #ff2222; }

  /* Hint controles */
  .hint {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 4000;
    background: rgba(10,10,16,0.92);
    border: 2px solid #ff2222;
    padding: 24px 32px; text-align: center;
    box-shadow: 0 0 30px rgba(255,34,34,0.4);
    transition: opacity 0.4s;
  }
  .hint.hidden { opacity: 0; pointer-events: none; }
  .hint h2 { color: #ff2222; margin: 0 0 10px; letter-spacing: 3px; }
  .hint p { margin: 4px 0; color: #8a839a; }
  .hint .key {
    display: inline-block; padding: 2px 8px;
    border: 1px solid #2a2a3a; background: #06060a;
    color: #d8d0e0; margin: 0 2px; font-size: 18px;
  }
  .hint b { color: #ff2222; }

  /* Esc para sair */
  .esc-hint {
    position: fixed; top: 16px; right: 22px;
    color: #4a4a5a; font-size: 16px; letter-spacing: 1px;
    z-index: 100; pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div class="static-overlay" id="staticOverlay"></div>
<div class="jumpscare" id="jumpscare"></div>

<div class="hud" id="hud" style="display:none;">
  <div class="hud-top">
    <div class="hud-box hud-game" id="hudGameName">—</div>
    <div class="hud-box hud-custards">🍮 <span id="hudCustards">0</span> / <span id="hudTotal">0</span></div>
  </div>
  <div class="hud-dist off" id="hudDist">DISTÂNCIA: —</div>
</div>

<div class="esc-hint">ESC para sair</div>

<div class="hint" id="hint">
  <h2>COMO JOGAR</h2>
  <p>Mova com <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span></p>
  <p>Colete todos os <b style="color:#ff9ed0;">Custards</b></p>
  <p>Fuja do <b>Slendytubby</b></p>
  <p style="margin-top:14px;color:#d8d0e0;" id="hintExtra">Pressione qualquer tecla para começar</p>
</div>

<div class="overlay" id="overlay">
  <h1 id="overlayTitle">GAME OVER</h1>
  <p id="overlayMsg">—</p>
  <div class="reward" id="overlayReward"></div>
  <button class="btn" id="overlayBtn">VOLTAR AO LOBBY</button>
</div>

<script src="core3d.js"></script>
<script type="module">
import * as THREE from 'three';

/* ============================================================
   Guards
   ============================================================ */
const Core = window.Custard3D;
const user = Core.getCurrentUser();
if (!user) {
  window.location.href = 'index.html';
}
const gameId = sessionStorage.getItem('cb3d_selected_game');
if (!gameId) {
  alert('Nenhum jogo selecionado.');
  window.location.href = 'index.html';
}
const game = Core.getGameById(gameId);
if (!game) {
  alert('Jogo não encontrado.');
  window.location.href = 'index.html';
}

/* ============================================================
   DataModel
   ============================================================ */
const dm = Core.deserializeDataModel(game.dataModel);

/* ============================================================
   Three.js base
   ============================================================ */
const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050508);

// Light da DataModel
const L = dm.Lighting.Properties;
const ambColor = L.Ambient || new Core.Color3(0.3, 0.3, 0.35);
const brightness = L.Brightness || 1.5;
const fogColor = L.FogColor || new Core.Color3(0.05, 0.05, 0.08);
const fogEnd = L.FogEnd || 120;

scene.fog = new THREE.Fog(
  new THREE.Color(fogColor.R, fogColor.G, fogColor.B).getHex(),
  fogEnd * 0.35,
  fogEnd
);

scene.add(new THREE.AmbientLight(
  new THREE.Color(ambColor.R, ambColor.G, ambColor.B).getHex(),
  0.8
));
const sun = new THREE.DirectionalLight(0xffffff, brightness);
sun.position.set(25, 40, 20);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -40;
sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40;
sun.shadow.camera.bottom = -40;
sun.shadow.camera.far = 120;
scene.add(sun);

const hemi = new THREE.HemisphereLight(0x7b2fbe, 0x0a0a10, 0.25);
scene.add(hemi);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  500
);

/* ============================================================
   Build Scene from DataModel
   ============================================================ */
const walls = [];        // { minX, maxX, minZ, maxZ }
const custards = [];     // { mesh, inst, collected }
const monsters = [];     // { mesh, inst, speed, baseY }
let playerSpawn = new THREE.Vector3(0, 1, 0);
let totalCustards = 0;

function buildMeshForInstance(inst) {
  const p = inst.Properties;
  const shape = p.Shape || 'Block';
  const size = p.Size || new Core.Vector3(1, 1, 1);
  const color = p.Color || new Core.Color3(0.6, 0.6, 0.6);
  const pos = p.Position || new Core.Vector3(0, 0, 0);
  const rot = p.Rotation || new Core.Vector3(0, 0, 0);
  const colorHex = new THREE.Color(color.R, color.G, color.B);

  if (shape === 'Slendytubby') {
    const group = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({
      color: colorHex, roughness: 0.85, metalness: 0.05
    });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.9, 2, 16), bodyMat);
    body.position.y = 1; body.castShadow = true; body.receiveShadow = true;
    group.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.75, 20, 20), bodyMat);
    head.position.y = 2.4; head.castShadow = true;
    group.add(head);
    const eyeMat = new THREE.MeshStandardMaterial({
      color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 3
    });
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.12, 10, 10), eyeMat);
    eyeL.position.set(-0.28, 2.5, 0.62);
    group.add(eyeL);
    const eyeR = eyeL.clone(); eyeR.position.x = 0.28; group.add(eyeR);
    // aura vermelha
    const auraGeo = new THREE.RingGeometry(0.9, 1.3, 24);
    const auraMat = new THREE.MeshBasicMaterial({
      color: 0xff0000, transparent: true, opacity: 0.25,
      side: THREE.DoubleSide
    });
    const aura = new THREE.Mesh(auraGeo, auraMat);
    aura.rotation.x = -Math.PI / 2; aura.position.y = 0.05;
    group.add(aura);
    group.scale.set(size.X / 3, size.Y / 4, size.Z / 3);
    group.position.set(pos.X, pos.Y, pos.Z);
    group.rotation.set(
      rot.X * Math.PI / 180, rot.Y * Math.PI / 180, rot.Z * Math.PI / 180
    );
    return group;
  }

  let geo;
  switch (shape) {
    case 'Sphere':   geo = new THREE.SphereGeometry(0.5, 24, 24); break;
    case 'Custard':  geo = new THREE.SphereGeometry(0.5, 24, 24); break;
    case 'Cylinder': geo = new THREE.CylinderGeometry(0.5, 0.5, 1, 24); break;
    case 'SpawnPoint': geo = new THREE.CylinderGeometry(0.85, 0.85, 1, 24); break;
    case 'Block':
    default:         geo = new THREE.BoxGeometry(1, 1, 1);
  }
  const mat = new THREE.MeshStandardMaterial({
    color: colorHex, roughness: 0.7, metalness: 0.05
  });
  if (shape === 'Custard') {
    mat.emissive = new THREE.Color(0xff9ed0).multiplyScalar(0.45);
  }
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.position.set(pos.X, pos.Y, pos.Z);
  mesh.rotation.set(
    rot.X * Math.PI / 180, rot.Y * Math.PI / 180, rot.Z * Math.PI / 180
  );
  mesh.scale.set(size.X, size.Y, size.Z);

  if (shape === 'SpawnPoint') {
    mat.transparent = true; mat.opacity = 0.6;
  }
  return mesh;
}

function walkDM(inst) {
  if (inst.ClassName === 'SpawnPoint') {
    const p = inst.Properties.Position;
    playerSpawn.set(p.X, p.Y + 1, p.Z);
    return;
  }
  if (inst.ClassName !== 'Part') {
    inst.Children.forEach(walkDM);
    return;
  }

  const shape = inst.Properties.Shape || 'Block';
  const mesh = buildMeshForInstance(inst);
  scene.add(mesh);

  if (shape === 'Custard') {
    custards.push({ mesh, inst, collected: false, baseY: mesh.position.y });
    totalCustards++;
  } else if (shape === 'Slendytubby') {
    monsters.push({
      mesh, inst,
      speed: 3.2,
      baseY: mesh.position.y
    });
  } else {
    // colisão XZ — usa bounding box
    const box = new THREE.Box3().setFromObject(mesh);
    walls.push({
      minX: box.min.x, maxX: box.max.x,
      minZ: box.min.z, maxZ: box.max.z,
      minY: box.min.y, maxY: box.max.y
    });
  }

  inst.Children.forEach(walkDM);
}
dm.Workspace.Children.forEach(walkDM);

// ajusta spawn à altura do chão se cair (fallback)
if (!isFinite(playerSpawn.y)) playerSpawn.y = 1;

/* ============================================================
   Player
   ============================================================ */
const playerMesh = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.5, 1, 4, 12),
  new THREE.MeshStandardMaterial({
    color: 0x7b2fbe, emissive: 0x3a0a5a, emissiveIntensity: 0.3, roughness: 0.6
  })
);
playerMesh.position.copy(playerSpawn);
playerMesh.castShadow = true;
playerMesh.receiveShadow = true;
scene.add(playerMesh);

// aura do player
const playerAuraGeo = new THREE.RingGeometry(0.8, 1.05, 24);
const playerAura = new THREE.Mesh(
  playerAuraGeo,
  new THREE.MeshBasicMaterial({
    color: 0x7b2fbe, transparent: true, opacity: 0.35,
    side: THREE.DoubleSide
  })
);
playerAura.rotation.x = -Math.PI / 2;
playerAura.position.copy(playerSpawn);
playerAura.position.y = 0.05;
scene.add(playerAura);

const player = {
  pos: playerSpawn.clone(),
  radius: 0.5,
  speed: 6,
  collected: 0
};

/* ============================================================
   Camera — third-person fixed-offset
   ============================================================ */
const CAM_OFFSET = new THREE.Vector3(0, 10, 12);
camera.position.copy(player.pos).add(CAM_OFFSET);
camera.lookAt(player.pos);

/* ============================================================
   Collision (circle vs rect in XZ)
   ============================================================ */
function circleHitsRect(cx, cz, r, rect) {
  const closestX = Math.max(rect.minX, Math.min(cx, rect.maxX));
  const closestZ = Math.max(rect.minZ, Math.min(cz, rect.maxZ));
  const dx = cx - closestX, dz = cz - closestZ;
  return (dx * dx + dz * dz) < (r * r);
}
function collidesAt(x, z, r) {
  for (let i = 0; i < walls.length; i++) {
    if (circleHitsRect(x, z, r, walls[i])) return true;
  }
  return false;
}

/* ============================================================
   Input
   ============================================================ */
const keys = {};
window.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '].includes(k)) {
    e.preventDefault();
  }
  keys[k] = true;
  if (state === 'waiting') {
    if (k !== 'escape') startGame();
  }
  if (k === 'escape' && (state === 'playing' || state === 'waiting')) {
    window.location.href = 'index.html';
  }
});
window.addEventListener('keyup', (e) => {
  keys[e.key.toLowerCase()] = false;
});

/* ============================================================
   Estado
   ============================================================ */
let state = 'waiting'; // waiting | playing | gameover | win
let lastTime = performance.now();
let nearestMonsterDist = Infinity;

/* ============================================================
   HUD / Overlays
   ============================================================ */
const hud = document.getElementById('hud');
const hudGameName = document.getElementById('hudGameName');
const hudCustards = document.getElementById('hudCustards');
const hudTotal = document.getElementById('hudTotal');
const hudDist = document.getElementById('hudDist');
const hintEl = document.getElementById('hint');
const hintExtra = document.getElementById('hintExtra');
const staticOverlay = document.getElementById('staticOverlay');
const jumpscareEl = document.getElementById('jumpscare');
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlayTitle');
const overlayMsg = document.getElementById('overlayMsg');
const overlayReward = document.getElementById('overlayReward');
const overlayBtn = document.getElementById('overlayBtn');

overlayBtn.addEventListener('click', () => {
  window.location.href = 'index.html';
});

// Avisos contextuais
(function setupHint() {
  const notes = [];
  if (totalCustards === 0) notes.push('⚠ Sem custards neste mapa — explore livremente');
  if (monsters.length === 0) notes.push('⚠ Sem Slendytubby neste mapa');
  if (notes.length) {
    hintExtra.innerHTML = notes.join('<br>') + '<br>Pressione qualquer tecla para começar';
  }
})();

function startGame() {
  state = 'playing';
  hintEl.classList.add('hidden');
  hud.style.display = 'block';
  hudGameName.textContent = game.name.length > 26 ? game.name.slice(0, 26) + '…' : game.name;
  hudTotal.textContent = totalCustards;
  hudCustards.textContent = '0';
  lastTime = performance.now();
  requestAnimationFrame(loop);
}

/* ============================================================
   Player update
   ============================================================ */
function updatePlayer(dt) {
  let dx = 0, dz = 0;
  if (keys['w'] || keys['arrowup'])    dz -= 1;
  if (keys['s'] || keys['arrowdown'])  dz += 1;
  if (keys['a'] || keys['arrowleft'])  dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;

  if (dx !== 0 || dz !== 0) {
    const len = Math.hypot(dx, dz);
    dx /= len; dz /= len;
    const step = player.speed * dt;

    const nx = player.pos.x + dx * step;
    if (!collidesAt(nx, player.pos.z, player.radius)) player.pos.x = nx;
    const nz = player.pos.z + dz * step;
    if (!collidesAt(player.pos.x, nz, player.radius)) player.pos.z = nz;

    playerMesh.rotation.y = Math.atan2(dx, dz);
  }

  playerMesh.position.copy(player.pos);
  playerAura.position.set(player.pos.x, 0.05, player.pos.z);

  // Anima custards (flutua + gira)
  const t = performance.now() * 0.001;
  for (const c of custards) {
    if (c.collected) continue;
    c.mesh.position.y = c.baseY + Math.sin(t * 2 + c.mesh.position.x) * 0.15;
    c.mesh.rotation.y += dt * 1.5;

    const dx2 = c.mesh.position.x - player.pos.x;
    const dz2 = c.mesh.position.z - player.pos.z;
    if (dx2 * dx2 + dz2 * dz2 < 1.6 * 1.6) {
      c.collected = true;
      c.mesh.visible = false;
      player.collected++;
      hudCustards.textContent = player.collected;
      Core.triggerScripts(c.inst, 'OnTouch', dm, {
        onAddCoin: (n) => Core.addCustards(n)
      });
      if (totalCustards > 0 && player.collected >= totalCustards) {
        triggerWin();
      }
    }
  }
}

/* ============================================================
   Monster AI — chase with wall avoidance
   ============================================================ */
function updateMonsters(dt) {
  nearestMonsterDist = Infinity;
  if (monsters.length === 0) { updateAtmosphere(); return; }

  const t = performance.now() * 0.001;

  for (const m of monsters) {
    const dx = player.pos.x - m.mesh.position.x;
    const dz = player.pos.z - m.mesh.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist < nearestMonsterDist) nearestMonsterDist = dist;

    // bob vertical
    m.mesh.position.y = m.baseY + Math.sin(t * 3) * 0.12;
    // encara o player
    m.mesh.rotation.y = Math.atan2(dx, dz);

    if (dist < 0.05) continue;

    // aceleração predatória quando perto
    const speedMult = dist < 5 ? 1.35 : 1;
    const step = m.speed * speedMult * dt;

    const dirX = dx / dist, dirZ = dz / dist;

    let moved = false;
    const nx = m.mesh.position.x + dirX * step;
    if (!collidesAt(nx, m.mesh.position.z, 0.55)) {
      m.mesh.position.x = nx; moved = true;
    }
    const nz = m.mesh.position.z + dirZ * step;
    if (!collidesAt(m.mesh.position.x, nz, 0.55)) {
      m.mesh.position.z = nz; moved = true;
    }

    // se travou, tenta perpendicular
    if (!moved) {
      const perpX = -dirZ, perpZ = dirX;
      const pX = m.mesh.position.x + perpX * step;
      if (!collidesAt(pX, m.mesh.position.z, 0.55)) m.mesh.position.x = pX;
      const pZ = m.mesh.position.z + perpZ * step;
      if (!collidesAt(m.mesh.position.x, pZ, 0.55)) m.mesh.position.z = pZ;
    }

    // touch = game over
    if (dist < 1.25) {
      triggerGameOver();
      return;
    }
  }

  updateAtmosphere();
}

/* ============================================================
   Atmosphere
   ============================================================ */
function updateAtmosphere() {
  if (monsters.length === 0 || !isFinite(nearestMonsterDist)) {
    staticOverlay.style.opacity = '0';
    hudDist.className = 'hud-dist off';
    hudDist.textContent = 'DISTÂNCIA: —';
    return;
  }
  const d = nearestMonsterDist;
  if (d < 8) {
    const op = Math.min(0.85, (8 - d) / 8);
    staticOverlay.style.opacity = op.toFixed(2);
  } else {
    staticOverlay.style.opacity = '0';
  }
  hudDist.textContent = 'DISTÂNCIA: ' + d.toFixed(1) + 'm';
  hudDist.classList.remove('safe', 'danger', 'off');
  if (d > 10) hudDist.classList.add('safe');
  else if (d < 5) hudDist.classList.add('danger');
}

/* ============================================================
   Camera follow
   ============================================================ */
function updateCamera(dt) {
  const target = player.pos.clone().add(CAM_OFFSET);
  const k = Math.min(1, dt * 8);
  camera.position.lerp(target, k);
  const lookAt = player.pos.clone().add(new THREE.Vector3(0, 1, 0));
  camera.lookAt(lookAt);
}

/* ============================================================
   Loop
   ============================================================ */
function loop(now) {
  if (state !== 'playing') return;
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  updatePlayer(dt);
  updateMonsters(dt);
  updateCamera(dt);

  renderer.render(scene, camera);

  if (state === 'playing') requestAnimationFrame(loop);
}

/* ============================================================
   Game Over / Win
   ============================================================ */
function triggerGameOver() {
  if (state !== 'playing') return;
  state = 'gameover';

  jumpscareEl.classList.add('flash');
  setTimeout(() => jumpscareEl.classList.remove('flash'), 100);
  setTimeout(() => jumpscareEl.classList.add('flash'), 180);
  setTimeout(() => jumpscareEl.classList.remove('flash'), 260);
  setTimeout(() => jumpscareEl.classList.add('flash'), 340);
  setTimeout(() => jumpscareEl.classList.remove('flash'), 420);

  setTimeout(() => {
    overlay.className = 'overlay lose show';
    overlayTitle.textContent = 'VOCÊ MORREU';
    overlayMsg.textContent = 'O Slendytubby te encontrou... Os custards coletados nesta corrida foram perdidos.';
    overlayReward.textContent = '';
  }, 850);
}

function triggerWin() {
  if (state !== 'playing') return;
  state = 'win';
  const reward = player.collected;
  if (reward > 0) Core.addCustards(reward);

  setTimeout(() => {
    overlay.className = 'overlay win show';
    overlayTitle.textContent = 'VOCÊ VENCEU';
    overlayMsg.textContent = 'Todos os custards foram coletados. Bom trabalho, sobrevivente.';
    overlayReward.textContent = reward > 0
      ? '+' + reward + ' Custards salvos na sua conta!'
      : 'Nenhum custard para coletar';
  }, 500);
}

/* ============================================================
   Resize + render inicial
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

renderer.render(scene, camera);
updateCamera(1);
</script>
</body>
</html>
