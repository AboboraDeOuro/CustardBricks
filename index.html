<!DOCTYPE html>
<html lang="pt-BR"><head>
<meta charset="UTF-8"><title>CustardBricks — Home</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head><body>
<nav id="topnav" class="topnav"></nav>
<main class="page">
  <div id="authView" style="display:none;">
    <div class="auth-card">
      <h1 id="aTitle">ENTRAR</h1>
      <p class="sub" id="aSub">Bem-vindo ao CustardBricks</p>
      <div class="field"><label>Nick</label><input type="text" id="aUser" maxlength="20" placeholder="NooNoo"></div>
      <div class="field" id="aEmailF" style="display:none;"><label>Email</label><input type="email" id="aEmail" maxlength="60"></div>
      <div class="field"><label>Senha</label><input type="password" id="aPass" maxlength="32"></div>
      <button class="btn primary" id="aBtn" style="width:100%;padding:12px;font-size:24px;margin-top:8px;">ENTRAR</button>
      <div class="auth-msg" id="aMsg"></div>
      <div class="auth-switch"><span id="aSwitchT">Sem conta?</span> <a id="aSwitchL">Criar conta</a></div>
    </div>
  </div>
  <div id="homeView" style="display:none;">
    <div class="hero" id="hero"></div>
    <h2 class="sec">EM DESTAQUE</h2>
    <div class="games-grid" id="featured"></div>
    <h2 class="sec">RECENTES</h2>
    <div class="games-grid" id="recent"></div>
  </div>
</main>
<script src="core.js"></script>
<script src="shared.js"></script>
<script>
(function () {
  let mode = 'login';
  const $ = id => document.getElementById(id);
  function renderAuth() {
    $('aMsg').textContent = '';
    $('aTitle').textContent = mode === 'login' ? 'ENTRAR' : 'CRIAR CONTA';
    $('aSub').textContent = mode === 'login' ? 'Bem-vindo ao CustardBricks' : 'Junte-se e ganhe 500 Custards';
    $('aBtn').textContent = mode === 'login' ? 'ENTRAR' : 'REGISTRAR';
    $('aEmailF').style.display = mode === 'register' ? 'block' : 'none';
    $('aSwitchT').textContent = mode === 'login' ? 'Sem conta?' : 'Já tem conta?';
    $('aSwitchL').textContent = mode === 'login' ? 'Criar conta' : 'Entrar';
  }
  $('aSwitchL').onclick = () => { mode = mode === 'login' ? 'register' : 'login'; renderAuth(); };
  $('aBtn').onclick = () => {
    const u = $('aUser').value.trim(), e = $('aEmail').value.trim(), p = $('aPass').value;
    const r = mode === 'login' ? CORE.login(u, p) : CORE.register(u, e, p);
    if (!r.ok) { $('aMsg').textContent = r.error; return; }
    toast(mode === 'login' ? 'Bem-vindo de volta!' : 'Conta criada! +500 Custards', true);
    route();
  };
  ['aUser','aPass','aEmail'].forEach(id => $(id).addEventListener('keydown', ev => { if (ev.key === 'Enter') $('aBtn').click(); }));

  function gameCard(g) {
    const colors = ['#7b2fbe','#ff2222','#3fa14b','#e8d347','#e8b347','#4a1a72'];
    const bg = colors[g.name.length % colors.length];
    const initial = (g.name || '?')[0].toUpperCase();
    return `<div class="game-card" onclick="play('${g.id}')">
      <div class="game-thumb" style="background:linear-gradient(135deg,${bg},#1a1a26);"><span>${initial}</span></div>
      <div class="game-info">
        <h3 class="game-name">${escapeHTML(g.name)}</h3>
        <div class="game-author">por @${escapeHTML(g.author)}</div>
        <div class="game-stats"><span>▶ ${g.plays||0}</span><span>♥ ${g.likes||0}</span></div>
        <span class="game-badge ${g.official?'official':''}">${g.official?'OFICIAL':'COMUNIDADE'}</span>
      </div>
      <button class="play-btn">▶ JOGAR</button>
    </div>`;
  }
  window.play = function (id) {
    CORE.incrementPlays(id);
    CORE.setSelectedGame(id);
    location.href = 'engine.html';
  };
  function renderHome() {
    const games = CORE.getGames();
    const hero = games[0];
    if (hero) {
      $('hero').innerHTML = `
        <div class="hero-content">
          <span class="hero-badge">⭐ DESTAQUE</span>
          <h2>${escapeHTML(hero.name)}</h2>
          <p>${escapeHTML(hero.description || 'Explore este mundo 3D.')}</p>
          <div class="hero-actions">
            <button class="btn primary" onclick="play('${hero.id}')">▶ JOGAR AGORA</button>
            <button class="btn" onclick="location.href='descobrir.html'">Ver Todos</button>
          </div>
        </div>`;
    }
    $('featured').innerHTML = games.slice(0, 4).map(gameCard).join('');
    $('recent').innerHTML = games.slice(4, 8).map(gameCard).join('') || '<div class="empty" style="grid-column:1/-1">Nenhum jogo recente. Crie no Studio!</div>';
  }

  function route() {
    const u = CORE.getCurrentUser();
    if (u) {
      $('authView').style.display = 'none';
      $('homeView').style.display = 'block';
      renderHome();
      renderNav();
    } else {
      $('authView').style.display = 'block';
      $('homeView').style.display = 'none';
      renderAuth();
    }
  }
  route();
  window.addEventListener('focus', () => { if (CORE.getCurrentUser()) { renderNav(); route(); } });
})();
</script>
</body></html>
