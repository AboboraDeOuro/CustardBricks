<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CustardBricks 3D — Lobby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a10;
    --bg2: #12121c;
    --bg3: #1a1a26;
    --red: #ff2222;
    --red-dark: #a01515;
    --purple: #7b2fbe;
    --purple-dark: #4a1a72;
    --text: #d8d0e0;
    --text-dim: #8a839a;
    --border: #2a2a3a;
    --warn: #e8d347;
    --ok: #3fa14b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'VT323', monospace; font-size: 20px;
  }

  /* Vinheta + Scanlines */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.88) 100%);
    z-index: 9000;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.03) 0px,
      rgba(255,255,255,0.03) 1px,
      transparent 1px, transparent 3px
    );
    z-index: 9001; mix-blend-mode: overlay;
    animation: flicker 0.15s infinite;
  }
  @keyframes flicker { 0%{opacity:.9}50%{opacity:1}100%{opacity:.85} }

  a { color: var(--red); text-decoration: none; }
  a:hover { text-shadow: 0 0 6px var(--red); }

  .app {
    max-width: 1150px;
    margin: 0 auto;
    padding: 24px 20px 60px;
    position: relative;
    z-index: 10;
  }

  header.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--border);
    padding-bottom: 12px;
    margin-bottom: 26px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .logo {
    font-size: 42px;
    letter-spacing: 3px;
    color: var(--red);
    text-shadow: 0 0 12px var(--red-dark), 0 0 24px var(--purple-dark);
    line-height: 1;
  }
  .logo span { color: var(--purple); }
  .logo small {
    display: block; font-size: 16px;
    color: var(--text-dim); letter-spacing: 2px;
    margin-top: 2px;
    text-shadow: none;
  }

  .userbar {
    display: flex; gap: 14px; align-items: center;
    flex-wrap: wrap;
  }
  .custards {
    color: var(--warn);
    text-shadow: 0 0 8px rgba(232,211,71,0.5);
  }
  .nick { color: var(--text); }

  .btn {
    font-family: 'VT323', monospace;
    font-size: 20px;
    padding: 6px 14px;
    background: var(--bg2);
    color: var(--text);
    border: 2px solid var(--border);
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.15s;
  }
  .btn:hover {
    border-color: var(--red);
    color: var(--red);
    box-shadow: 0 0 10px rgba(255,34,34,0.4);
  }
  .btn.primary {
    background: var(--red-dark);
    border-color: var(--red);
    color: #fff;
  }
  .btn.primary:hover {
    background: var(--red);
    box-shadow: 0 0 16px var(--red);
  }
  .btn.ok {
    background: #1a5f24;
    border-color: var(--ok);
    color: #fff;
  }
  .btn.ok:hover {
    background: var(--ok);
    box-shadow: 0 0 16px var(--ok);
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Auth box */
  .auth-box {
    max-width: 440px;
    margin: 50px auto;
    padding: 30px;
    background: var(--bg2);
    border: 2px solid var(--border);
    box-shadow: 0 0 30px rgba(255,34,34,0.15), inset 0 0 40px rgba(123,47,190,0.08);
  }
  .auth-box h2 {
    color: var(--red);
    margin-top: 0;
    text-align: center;
    letter-spacing: 3px;
    font-size: 34px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 18px;
    color: var(--text-dim);
    margin-bottom: 4px;
  }
  .field input {
    width: 100%;
    padding: 8px 10px;
    background: #06060a;
    border: 2px solid var(--border);
    color: var(--text);
    font-family: 'VT323', monospace;
    font-size: 20px;
    outline: none;
  }
  .field input:focus {
    border-color: var(--red);
    box-shadow: 0 0 10px rgba(255,34,34,0.4);
  }
  .auth-msg {
    text-align: center; min-height: 22px;
    color: var(--red); font-size: 18px; margin-top: 10px;
  }
  .auth-switch {
    text-align: center; margin-top: 12px;
    font-size: 18px; color: var(--text-dim);
  }

  /* Profile */
  .profile-card {
    background: var(--bg2);
    border: 2px solid var(--border);
    padding: 22px;
    margin-bottom: 26px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 18px;
    box-shadow: inset 0 0 30px rgba(123,47,190,0.1);
    position: relative;
    overflow: hidden;
  }
  .profile-card::after {
    content: "3D";
    position: absolute;
    right: -10px; bottom: -30px;
    font-size: 160px;
    color: rgba(123,47,190,0.07);
    letter-spacing: -6px;
    pointer-events: none;
    font-weight: bold;
  }
  .profile-card .welcome {
    font-size: 30px;
    color: var(--text);
    margin-bottom: 4px;
  }
  .profile-card .welcome .nick-highlight {
    color: var(--red);
    text-shadow: 0 0 10px var(--red-dark);
  }
  .profile-card .custards-big {
    color: var(--warn);
    font-size: 34px;
    text-shadow: 0 0 10px rgba(232,211,71,0.5);
    margin-top: 6px;
  }
  .profile-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    z-index: 1;
  }
  .profile-actions .btn {
    font-size: 22px;
    padding: 10px 22px;
  }

  /* Section title */
  .section-title {
    font-size: 26px;
    color: var(--purple);
    text-shadow: 0 0 8px var(--purple-dark);
    letter-spacing: 2px;
    margin: 26px 0 14px;
    border-left: 4px solid var(--red);
    padding-left: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-title .count {
    font-size: 16px;
    color: var(--text-dim);
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 2px 10px;
    border-radius: 2px;
  }

  /* Games grid */
  .games-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .game-card {
    background: var(--bg2);
    border: 2px solid var(--border);
    padding: 18px;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .game-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--purple), var(--red));
    opacity: 0.6;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s;
  }
  .game-card:hover::before { transform: scaleX(1); }
  .game-card::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent 40%, rgba(255,34,34,0.08) 100%);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .game-card:hover::after { opacity: 1; }
  .game-card:hover {
    border-color: var(--red);
    transform: translateY(-3px);
    box-shadow: 0 6px 24px rgba(255,34,34,0.3);
  }
  .game-card h3 {
    margin: 0 0 8px;
    color: var(--red);
    font-size: 26px;
    letter-spacing: 1px;
    line-height: 1.1;
    word-break: break-word;
  }
  .game-card .author {
    color: var(--text-dim);
    font-size: 17px;
  }
  .game-card .badge {
    display: inline-block;
    font-size: 14px;
    padding: 2px 10px;
    background: var(--purple-dark);
    color: #eee;
    margin-top: 10px;
    letter-spacing: 1px;
  }
  .game-card .badge.official {
    background: var(--red-dark);
    color: #fff;
  }
  .game-card .play {
    margin-top: 14px;
    display: block;
    width: 100%;
    text-align: center;
    font-size: 22px;
    padding: 8px 0;
  }

  /* Empty state */
  .empty-games {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    font-size: 22px;
    border: 2px dashed var(--border);
    background: var(--bg2);
  }
  .empty-games .sub {
    font-size: 16px;
    margin-top: 8px;
    color: var(--text-dim);
    opacity: 0.7;
  }

  /* Footer */
  .footer-links {
    margin-top: 50px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    text-align: center;
    color: var(--text-dim);
    font-size: 17px;
    letter-spacing: 1px;
  }
  .footer-links a { margin: 0 12px; }
  .footer-links .version {
    display: block;
    margin-top: 8px;
    font-size: 14px;
    color: #4a4a5a;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: var(--bg2);
    border: 2px solid var(--red);
    color: var(--text);
    padding: 10px 22px;
    z-index: 9500;
    transition: transform 0.3s;
    box-shadow: 0 0 20px rgba(255,34,34,0.5);
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.ok {
    border-color: var(--ok);
    box-shadow: 0 0 20px rgba(63,161,75,0.5);
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="logo">
      CUSTARD<span>BRICKS</span>
      <small>— 3D PLATFORM —</small>
    </div>
    <div class="userbar" id="userbar"></div>
  </header>

  <!-- ================= LOGIN / REGISTRO ================= -->
  <section id="viewLogin" style="display:none;">
    <div class="auth-box">
      <h2 id="authTitle">ENTRAR</h2>
      <div class="field">
        <label>Nick</label>
        <input type="text" id="authNick" maxlength="16" autocomplete="off" placeholder="Ex: NooNoo" />
      </div>
      <div class="field">
        <label>Senha</label>
        <input type="password" id="authPass" maxlength="32" placeholder="••••" />
      </div>
      <button class="btn primary" id="authSubmit" style="width:100%;padding:10px;font-size:22px;margin-top:8px;">
        ENTRAR
      </button>
      <div class="auth-msg" id="authMsg"></div>
      <div class="auth-switch">
        <span id="authSwitchText">Sem conta?</span>
        <a href="#" id="authSwitchLink">Criar conta</a>
      </div>
    </div>
  </section>

  <!-- ================= LOBBY ================= -->
  <section id="viewLobby" style="display:none;">
    <div class="profile-card">
      <div>
        <div class="welcome">
          Bem-vindo, <span class="nick-highlight" id="lobbyNick">—</span>
        </div>
        <div style="color:var(--text-dim);font-size:18px;">Custards disponíveis:</div>
        <div class="custards-big" id="lobbyCustards">0</div>
      </div>
      <div class="profile-actions">
        <button class="btn primary" id="openStudioBtn" style="padding:12px 24px;">
          🛠 ABRIR STUDIO 3D
        </button>
      </div>
    </div>

    <div class="section-title">
      JOGOS 3D DISPONÍVEIS
      <span class="count" id="gamesCount">0</span>
    </div>
    <div class="games-grid" id="gamesGrid"></div>
  </section>

  <div class="footer-links">
    <a href="studio3d.html">Studio 3D</a> |
    <a href="#" id="logoutLink">Sair</a>
    <span class="version">CustardBricks 3D v0.1 — open source</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="core3d.js"></script>
<script>
(function () {
  'use strict';
  const Core = window.Custard3D;

  /* ---------- Toast ---------- */
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function toast(msg, isOk) {
    toastEl.textContent = msg;
    toastEl.classList.toggle('ok', !!isOk);
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  /* ---------- DOM ---------- */
  const viewLogin = document.getElementById('viewLogin');
  const viewLobby = document.getElementById('viewLobby');
  const userbar = document.getElementById('userbar');
  const authTitle = document.getElementById('authTitle');
  const authNick = document.getElementById('authNick');
  const authPass = document.getElementById('authPass');
  const authMsg = document.getElementById('authMsg');
  const authSubmit = document.getElementById('authSubmit');
  const authSwitchText = document.getElementById('authSwitchText');
  const authSwitchLink = document.getElementById('authSwitchLink');
  const lobbyNick = document.getElementById('lobbyNick');
  const lobbyCustards = document.getElementById('lobbyCustards');
  const gamesGrid = document.getElementById('gamesGrid');
  const gamesCount = document.getElementById('gamesCount');
  const logoutLink = document.getElementById('logoutLink');
  const openStudioBtn = document.getElementById('openStudioBtn');

  /* ---------- Auth state ---------- */
  let authMode = 'login';

  function renderUserbar() {
    const u = Core.getCurrentUser();
    if (!u) { userbar.innerHTML = ''; return; }
    userbar.innerHTML = `
      <div class="custards">💰 ${u.custards} Custards</div>
      <div class="nick">👤 ${escapeHTML(u.nick)}</div>
    `;
  }

  function route() {
    const u = Core.getCurrentUser();
    if (u) {
      viewLogin.style.display = 'none';
      viewLobby.style.display = 'block';
      lobbyNick.textContent = u.nick;
      lobbyCustards.textContent = u.custards;
      renderUserbar();
      renderGames();
    } else {
      viewLogin.style.display = 'block';
      viewLobby.style.display = 'none';
      renderUserbar();
      renderAuthForm();
    }
  }

  /* ---------- Auth form ---------- */
  function renderAuthForm() {
    authMsg.textContent = '';
    if (authMode === 'login') {
      authTitle.textContent = 'ENTRAR';
      authSubmit.textContent = 'ENTRAR';
      authSwitchText.textContent = 'Sem conta?';
      authSwitchLink.textContent = 'Criar conta';
    } else {
      authTitle.textContent = 'CRIAR CONTA';
      authSubmit.textContent = 'REGISTRAR';
      authSwitchText.textContent = 'Já tem conta?';
      authSwitchLink.textContent = 'Entrar';
    }
  }

  authSwitchLink.addEventListener('click', (e) => {
    e.preventDefault();
    authMode = authMode === 'login' ? 'register' : 'login';
    renderAuthForm();
  });

  authSubmit.addEventListener('click', () => {
    const nick = authNick.value.trim();
    const pass = authPass.value;
    authMsg.textContent = '';

    if (authMode === 'login') {
      const r = Core.login(nick, pass);
      if (!r.ok) { authMsg.textContent = r.error; return; }
      toast('Bem-vindo, ' + r.user.nick + '!', true);
      route();
    } else {
      const r = Core.register(nick, pass);
      if (!r.ok) { authMsg.textContent = r.error; return; }
      toast('Conta criada. +500 Custards de boas-vindas!', true);
      route();
    }
  });

  [authNick, authPass].forEach(el => {
    el.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') authSubmit.click();
    });
  });

  logoutLink.addEventListener('click', (e) => {
    e.preventDefault();
    Core.logout();
    route();
    toast('Você saiu.');
  });

  openStudioBtn.addEventListener('click', () => {
    window.location.href = 'studio3d.html';
  });

  /* ---------- Games feed ---------- */
  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[m]));
  }

  function renderGames() {
    const games = Core.getGames();
    gamesGrid.innerHTML = '';
    gamesCount.textContent = games.length;

    if (!games.length) {
      gamesGrid.innerHTML = `
        <div class="empty-games" style="grid-column: 1/-1;">
          Nenhum jogo publicado ainda.
          <div class="sub">Abra o Studio 3D e crie o primeiro!</div>
        </div>`;
      return;
    }

    games.forEach(g => {
      const card = document.createElement('div');
      card.className = 'game-card';
      card.innerHTML = `
        <h3>${escapeHTML(g.name)}</h3>
        <div class="author">por ${escapeHTML(g.author || 'Anônimo')}</div>
        <div class="badge ${g.official ? 'official' : ''}">
          ${g.official ? 'OFICIAL' : 'COMUNIDADE'}
        </div>
        <button class="btn primary play">▶ JOGAR</button>
      `;
      card.addEventListener('click', () => playGame(g.id));
      gamesGrid.appendChild(card);
    });
  }

  function playGame(id) {
    const game = Core.getGameById(id);
    if (!game) { toast('Jogo não encontrado.', false); return; }
    sessionStorage.setItem('cb3d_selected_game', id);
    window.location.href = 'engine3d.html';
  }

  /* ---------- Sync ---------- */
  // Ao voltar do engine (que adiciona custards), atualiza
  window.addEventListener('focus', () => {
    const u = Core.getCurrentUser();
    if (u) {
      lobbyCustards.textContent = u.custards;
      renderUserbar();
      renderGames();
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      const u = Core.getCurrentUser();
      if (u) {
        lobbyCustards.textContent = u.custards;
        renderUserbar();
      }
    }
  });

  /* ---------- Boot ---------- */
  route();
})();
</script>
</body>
</html>
