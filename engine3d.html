<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CustardBricks — Gameplay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a10;
    --bg2: #12121c;
    --red: #ff2222;
    --red-dark: #a01515;
    --purple: #7b2fbe;
    --purple-dark: #4a1a72;
    --text: #d8d0e0;
    --text-dim: #8a839a;
    --border: #2a2a3a;
    --warn: #e8d347;
    --ok: #3fa14b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    background: #000;
    color: var(--text);
    font-family: 'VT323', monospace;
    font-size: 20px;
    overflow: hidden;
  }

  /* Vinheta global + scanlines */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,0.9) 100%);
    z-index: 9000;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.04) 0px,
      rgba(255,255,255,0.04) 1px,
      transparent 1px, transparent 3px
    );
    z-index: 9001; mix-blend-mode: overlay;
    animation: flicker 0.15s infinite;
  }
  @keyframes flicker { 0%{opacity:.9}50%{opacity:1}100%{opacity:.85} }

  .game-wrap {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000;
  }

  canvas#gameCanvas {
    display: block;
    background: #000;
    image-rendering: pixelated;
    /* Filtro de câmera analógica */
    filter: contrast(1.15) saturate(0.85) brightness(0.95);
  }

  /* HUD */
  .hud {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 100;
    padding: 16px 22px;
    font-size: 22px;
    text-shadow: 0 0 6px #000, 0 0 12px #000;
  }
  .hud .top {
    display: flex; justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }
  .hud .hud-box {
    background: rgba(10,10,16,0.65);
    border: 2px solid var(--border);
    padding: 6px 12px;
    letter-spacing: 1px;
    backdrop-filter: blur(2px);
  }
  .hud .custards { color: #ff9ed0; }
  .hud .game-name { color: var(--purple); }
  .hud .distance {
    position: fixed;
    bottom: 22px; left: 50%;
    transform: translateX(-50%);
    color: var(--red);
    text-shadow: 0 0 8px var(--red-dark);
    background: rgba(10,10,16,0.75);
    padding: 6px 16px;
    border: 2px solid var(--border);
    letter-spacing: 2px;
  }
  .hud .distance.safe { color: var(--ok); text-shadow: 0 0 8px #1a5f24; }
  .hud .distance.danger { color: var(--red); animation: pulse 0.4s infinite alternate; }
  @keyframes pulse { from { opacity: 0.7; } to { opacity: 1; } }

  /* Overlay de Game Over / Vitória */
  .overlay {
    position: fixed; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.85);
    z-index: 5000;
    text-align: center;
    flex-direction: column;
    gap: 16px;
    padding: 20px;
  }
  .overlay.show { display: flex; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .overlay h1 {
    font-size: 72px;
    margin: 0;
    letter-spacing: 4px;
  }
  .overlay.lose h1 {
    color: var(--red);
    text-shadow: 0 0 20px var(--red), 0 0 40px var(--red-dark);
    animation: shake 0.5s infinite;
  }
  @keyframes shake {
    0%,100%{transform:translate(0,0)}
    25%{transform:translate(-3px,2px)}
    50%{transform:translate(3px,-2px)}
    75%{transform:translate(-2px,-2px)}
  }
  .overlay.win h1 {
    color: var(--warn);
    text-shadow: 0 0 20px var(--warn), 0 0 40px #a07a10;
  }
  .overlay p { font-size: 24px; color: var(--text-dim); margin: 0; max-width: 600px; }
  .overlay .big-num {
    font-size: 40px; color: #ff9ed0; text-shadow: 0 0 12px #b03a78;
  }
  .overlay .btn {
    font-family: 'VT323', monospace;
    font-size: 24px;
    padding: 10px 26px;
    background: var(--bg2);
    color: var(--text);
    border: 2px solid var(--red);
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.15s;
  }
  .overlay .btn:hover {
    background: var(--red-dark);
    box-shadow: 0 0 18px var(--red);
  }

  /* Efeito de susto (flash vermelho) */
  .jumpscare {
    position: fixed; inset: 0;
    background: #ff0000;
    opacity: 0;
    pointer-events: none;
    z-index: 8000;
    transition: opacity 0.05s;
  }
  .jumpscare.flash { opacity: 0.8; }

  /* Instruções iniciais */
  .controls-hint {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 4000;
    background: rgba(10,10,16,0.9);
    border: 2px solid var(--red);
    padding: 24px 32px;
    text-align: center;
    box-shadow: 0 0 30px rgba(255,34,34,0.4);
    transition: opacity 0.4s;
  }
  .controls-hint h2 { color: var(--red); margin: 0 0 10px; letter-spacing: 3px; }
  .controls-hint p { margin: 4px 0; color: var(--text-dim); }
  .controls-hint .key {
    display: inline-block;
    padding: 2px 8px;
    border: 1px solid var(--border);
    background: #06060a;
    color: var(--text);
    margin: 0 2px;
    font-size: 18px;
  }
  .controls-hint.hidden { opacity: 0; pointer-events: none; }

  /* Static overlay (ruído) quando monstro perto */
  .static-overlay {
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 9500;
    opacity: 0;
    background-image:
      repeating-radial-gradient(circle at 30% 40%, rgba(255,255,255,0.08) 0, transparent 2px),
      repeating-radial-gradient(circle at 70% 60%, rgba(255,255,255,0.05) 0, transparent 3px);
    background-size: 4px 4px, 6px 6px;
    animation: staticMove 0.12s steps(3) infinite;
    mix-blend-mode: screen;
    transition: opacity 0.2s;
  }
  @keyframes staticMove {
    0% { background-position: 0 0, 0 0; }
    33% { background-position: 2px 1px, -1px 2px; }
    66% { background-position: -1px 2px, 2px -1px; }
    100% { background-position: 1px -1px, -2px 1px; }
  }
</style>
</head>
<body>

<div class="game-wrap">
  <canvas id="gameCanvas" width="800" height="800"></canvas>
</div>

<!-- HUD -->
<div class="hud" id="hud" style="display:none;">
  <div class="top">
    <div class="hud-box game-name" id="hudGameName">—</div>
    <div class="hud-box custards">
      🍮 <span id="hudCustards">0</span> / <span id="hudTotal">0</span>
    </div>
  </div>
  <div class="distance" id="hudDistance">DISTÂNCIA: —</div>
</div>

<!-- Static overlay -->
<div class="static-overlay" id="staticOverlay"></div>
<div class="jumpscare" id="jumpscare"></div>

<!-- Controles hint -->
<div class="controls-hint" id="controlsHint">
  <h2>COMO JOGAR</h2>
  <p>Mova-se com <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> ou setas</p>
  <p>Colete <b style="color:#ff9ed0;">todos os Cremes de Aveia</b></p>
  <p>Fuja do <b style="color:var(--red);">Slendytubby</b></p>
  <p style="margin-top:14px;color:var(--text);">Pressione qualquer tecla para começar</p>
</div>

<!-- Overlay resultado -->
<div class="overlay" id="resultOverlay">
  <h1 id="resultTitle">GAME OVER</h1>
  <p id="resultMsg">—</p>
  <div class="big-num" id="resultReward"></div>
  <button class="btn" id="resultBtn">VOLTAR AO LOBBY</button>
</div>

<script src="core.js"></script>
<script>
(function () {
  'use strict';
  const Core = window.CustardCore;

  /* =========================================================
     Inicialização: precisa de usuário + jogo selecionado
     ========================================================= */
  const user = Core.getCurrentUser();
  if (!user) {
    window.location.href = 'index.html';
    return;
  }
  const game = Core.getSelectedGameForPlay();
  if (!game) {
    alert('Nenhum jogo selecionado.');
    window.location.href = 'index.html';
    return;
  }
  const avatar = Core.getAvatar();

  /* =========================================================
     Config do Canvas
     ========================================================= */
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const hudGameName = document.getElementById('hudGameName');
  const hudCustards = document.getElementById('hudCustards');
  const hudTotal = document.getElementById('hudTotal');
  const hudDistance = document.getElementById('hudDistance');
  const staticOverlay = document.getElementById('staticOverlay');
  const jumpscareEl = document.getElementById('jumpscare');
  const controlsHint = document.getElementById('controlsHint');
  const resultOverlay = document.getElementById('resultOverlay');
  const resultTitle = document.getElementById('resultTitle');
  const resultMsg = document.getElementById('resultMsg');
  const resultReward = document.getElementById('resultReward');
  const resultBtn = document.getElementById('resultBtn');

  // Tamanho da célula responsivo ao tamanho do mapa
  const MAP_SIZE = game.size || game.grid.length;
  const CELL = Math.floor(Math.min(window.innerWidth, window.innerHeight) * 0.9 / MAP_SIZE);
  const CANVAS_SIZE = CELL * MAP_SIZE;
  canvas.width = CANVAS_SIZE;
  canvas.height = CANVAS_SIZE;

  // Ajuste de display para caber na tela
  canvas.style.width = CANVAS_SIZE + 'px';
  canvas.style.height = CANVAS_SIZE + 'px';

  /* =========================================================
     Parse do mapa
     ========================================================= */
  const grid = game.grid;
  let totalCustards = 0;
  let playerSpawn = { x: 1, y: 1 };
  let monsterSpawn = { x: MAP_SIZE - 2, y: MAP_SIZE - 2 };

  // Trabalhamos com uma cópia do grid para remover custards conforme coleta
  const mapCells = [];
  for (let y = 0; y < MAP_SIZE; y++) {
    const row = [];
    for (let x = 0; x < MAP_SIZE; x++) {
      let v = grid[y][x];
      if (v === 'spawn_player') { playerSpawn = { x, y }; v = 'floor'; }
      else if (v === 'spawn_monster') { monsterSpawn = { x, y }; v = 'floor'; }
      else if (v === 'custard') { totalCustards++; }
      row.push(v);
    }
    mapCells.push(row);
  }

  /* =========================================================
     Entidades
     ========================================================= */
  const player = {
    x: playerSpawn.x,
    y: playerSpawn.y,
    px: playerSpawn.x * CELL + CELL / 2,
    py: playerSpawn.y * CELL + CELL / 2,
    speed: 4.2,             // pixels por frame (60fps)
    radius: CELL * 0.32,
    facing: 'down',
    collected: 0
  };

  const monster = {
    x: monsterSpawn.x,
    y: monsterSpawn.y,
    px: monsterSpawn.x * CELL + CELL / 2,
    py: monsterSpawn.y * CELL + CELL / 2,
    speed: 2.3,
    radius: CELL * 0.36
  };

  /* =========================================================
     Estado de jogo
     ========================================================= */
  let state = 'waiting'; // waiting | playing | gameover | win
  const keys = {};
  let lastTime = 0;
  let animTime = 0;

  /* =========================================================
     Input
     ========================================================= */
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) {
      e.preventDefault();
    }
    keys[k] = true;

    if (state === 'waiting') {
      startGame();
    }
  });
  window.addEventListener('keyup', (e) => {
    keys[e.key.toLowerCase()] = false;
  });

  function startGame() {
    state = 'playing';
    hud.style.display = 'block';
    controlsHint.classList.add('hidden');
    hudGameName.textContent = game.name;
    hudTotal.textContent = totalCustards;
    hudCustards.textContent = '0';
    lastTime = performance.now();
    requestAnimationFrame(loop);
  }

  /* =========================================================
     Colisão (mapa)
     ========================================================= */
  function isWall(gx, gy) {
    if (gx < 0 || gy < 0 || gx >= MAP_SIZE || gy >= MAP_SIZE) return true;
    return mapCells[gy][gx] === 'wall';
  }

  function circleHitsWall(cx, cy, r) {
    const minX = Math.floor((cx - r) / CELL);
    const maxX = Math.floor((cx + r) / CELL);
    const minY = Math.floor((cy - r) / CELL);
    const maxY = Math.floor((cy + r) / CELL);
    for (let gy = minY; gy <= maxY; gy++) {
      for (let gx = minX; gx <= maxX; gx++) {
        if (isWall(gx, gy)) {
          // AABB x círculo aproximado: usa ponto mais próximo
          const rx = Math.max(gx * CELL, Math.min(cx, (gx + 1) * CELL));
          const ry = Math.max(gy * CELL, Math.min(cy, (gy + 1) * CELL));
          const dx = cx - rx, dy = cy - ry;
          if (dx*dx + dy*dy < r*r) return true;
        }
      }
    }
    return false;
  }

  /* =========================================================
     Movimento do jogador
     ========================================================= */
  function updatePlayer(dt) {
    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;

    if (dx === 0 && dy === 0) return;

    // normaliza diagonal
    if (dx !== 0 && dy !== 0) { dx *= 0.7071; dy *= 0.7071; }

    // facing
    if (Math.abs(dx) > Math.abs(dy)) player.facing = dx > 0 ? 'right' : 'left';
    else player.facing = dy > 0 ? 'down' : 'up';

    const dist = player.speed * dt * 60 / 60; // dt em ms -> fator
    const step = player.speed * (dt / 16.6667);

    // move no eixo X
    let nx = player.px + dx * step;
    if (!circleHitsWall(nx, player.py, player.radius)) {
      player.px = nx;
    }
    // move no eixo Y
    let ny = player.py + dy * step;
    if (!circleHitsWall(player.px, ny, player.radius)) {
      player.py = ny;
    }

    // atualiza grid
    player.x = Math.floor(player.px / CELL);
    player.y = Math.floor(player.py / CELL);

    // coleta custards
    const gx = player.x, gy = player.y;
    if (mapCells[gy] && mapCells[gy][gx] === 'custard') {
      mapCells[gy][gx] = 'floor';
      player.collected++;
      hudCustards.textContent = player.collected;
      if (player.collected >= totalCustards) {
        triggerWin();
      }
    }
  }

  /* =========================================================
     IA do Monstro — BFS + interpolação
     ========================================================= */
  let monsterPath = [];
  let pathRecalcTimer = 0;

  function bfsPath(from, to) {
    // from, to = {x, y}
    const q = [[from.x, from.y]];
    const visited = new Set();
    const parent = {};
    visited.add(from.y * MAP_SIZE + from.x);
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];

    while (q.length) {
      const [cx, cy] = q.shift();
      if (cx === to.x && cy === to.y) {
        // reconstrói
        const path = [];
        let key = cy * MAP_SIZE + cx;
        let cur = [cx, cy];
        while (cur) {
          path.unshift({ x: cur[0], y: cur[1] });
          const pk = parent[cur[1] * MAP_SIZE + cur[0]];
          if (!pk) break;
          cur = pk;
        }
        return path;
      }
      for (const [dx, dy] of dirs) {
        const nx = cx + dx, ny = cy + dy;
        if (isWall(nx, ny)) continue;
        const k = ny * MAP_SIZE + nx;
        if (visited.has(k)) continue;
        visited.add(k);
        parent[ny * MAP_SIZE + nx] = [cx, cy];
        q.push([nx, ny]);
      }
    }
    return [];
  }

  function updateMonster(dt) {
    // distância atual em células
    const dxg = player.x - monster.x;
    const dyg = player.y - monster.y;
    const distCells = Math.sqrt(dxg*dxg + dyg*dyg);

    // recalcula caminho a cada ~250ms OU se muito longe
    pathRecalcTimer += dt;
    if (pathRecalcTimer > 250 || monsterPath.length === 0) {
      pathRecalcTimer = 0;
      monsterPath = bfsPath(
        { x: monster.x, y: monster.y },
        { x: player.x, y: player.y }
      );
      // remove o primeiro nó (onde o monstro já está)
      if (monsterPath.length > 1) monsterPath.shift();
    }

    // move em direção ao próximo nó
    if (monsterPath.length > 0) {
      const next = monsterPath[0];
      const tx = next.x * CELL + CELL / 2;
      const ty = next.y * CELL + CELL / 2;
      const mdx = tx - monster.px;
      const mdy = ty - monster.py;
      const len = Math.hypot(mdx, mdy);
      const step = monster.speed * (dt / 16.6667);

      // aceleração se estiver perto (comportamento predatório)
      const speedMult = distCells < 3 ? 1.35 : 1;
      const realStep = step * speedMult;

      if (len < realStep) {
        monster.px = tx;
        monster.py = ty;
        monster.x = next.x;
        monster.y = next.y;
        monsterPath.shift();
      } else {
        monster.px += (mdx / len) * realStep;
        monster.py += (mdy / len) * realStep;
        monster.x = Math.floor(monster.px / CELL);
        monster.y = Math.floor(monster.py / CELL);
      }
    }

    // colisão com jogador
    const pdx = player.px - monster.px;
    const pdy = player.py - monster.py;
    const pdist = Math.hypot(pdx, pdy);
    if (pdist < (player.radius + monster.radius) * 0.85) {
      triggerGameOver();
    }

    // efeitos baseados na distância
    updateAtmosphere(distCells);
  }

  /* =========================================================
     Atmosfera (static / distância)
     ========================================================= */
  function updateAtmosphere(distCells) {
    // static
    if (distCells < 6) {
      const opacity = Math.min(0.9, (6 - distCells) / 6);
      staticOverlay.style.opacity = opacity.toFixed(2);
    } else {
      staticOverlay.style.opacity = '0';
    }

    // HUD distância
    hudDistance.textContent = 'DISTÂNCIA: ' + distCells.toFixed(1) + 'm';
    hudDistance.classList.remove('safe', 'danger');
    if (distCells > 8) hudDistance.classList.add('safe');
    else if (distCells < 4) hudDistance.classList.add('danger');
  }

  /* =========================================================
     Render
     ========================================================= */
  function drawMap() {
    // fundo
    ctx.fillStyle = '#050508';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let y = 0; y < MAP_SIZE; y++) {
      for (let x = 0; x < MAP_SIZE; x++) {
        const v = mapCells[y][x];
        const px = x * CELL, py = y * CELL;
        if (v === 'floor') {
          ctx.fillStyle = '#14141c';
          ctx.fillRect(px, py, CELL, CELL);
          ctx.strokeStyle = 'rgba(123,47,190,0.08)';
          ctx.lineWidth = 1;
          ctx.strokeRect(px + 0.5, py + 0.5, CELL - 1, CELL - 1);
        } else if (v === 'wall') {
          ctx.fillStyle = '#4a4a5a';
          ctx.fillRect(px, py, CELL, CELL);
          ctx.fillStyle = '#3a3a48';
          ctx.fillRect(px + 2, py + 2, CELL - 4, CELL - 4);
          ctx.fillStyle = 'rgba(0,0,0,0.35)';
          ctx.fillRect(px + 4, py + CELL - 8, CELL - 8, 4);
        } else if (v === 'custard') {
          // brilho pulsante
          const pulse = 0.85 + Math.sin(animTime * 0.006 + x + y) * 0.15;
          ctx.fillStyle = `rgba(255,158,208,${pulse})`;
          ctx.beginPath();
          ctx.arc(px + CELL/2, py + CELL/2, CELL * 0.28, 0, Math.PI*2);
          ctx.fill();
          ctx.strokeStyle = '#b03a78';
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.beginPath();
          ctx.arc(px + CELL/2 - CELL*0.1, py + CELL/2 - CELL*0.1, CELL*0.06, 0, Math.PI*2);
          ctx.fill();
        }
      }
    }
  }

  function drawTeletubby(cx, cy, radius, bodyColor, antenna, isMonster, eyesRed, facing) {
    // sombra
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.ellipse(cx, cy + radius * 0.85, radius * 0.9, radius * 0.28, 0, 0, Math.PI * 2);
    ctx.fill();

    // corpo (círculo)
    ctx.fillStyle = bodyColor;
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.stroke();

    // barriga clara (rosto)
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(cx, cy + radius * 0.15, radius * 0.55, 0, Math.PI * 2);
    ctx.fill();

    // olhos
    const eyeOffsetX = radius * 0.22;
    const eyeY = cy + radius * 0.05;
    if (eyesRed) {
      // olhos vermelhos brilhantes
      ctx.shadowColor = '#ff0000';
      ctx.shadowBlur = 14;
      ctx.fillStyle = '#ff2222';
    } else {
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#000';
    }
    ctx.beginPath(); ctx.arc(cx - eyeOffsetX, eyeY, radius * 0.11, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + eyeOffsetX, eyeY, radius * 0.11, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;

    // olhos negros internos (para os vermelhos)
    if (eyesRed) {
      ctx.fillStyle = '#400';
      ctx.beginPath(); ctx.arc(cx - eyeOffsetX, eyeY, radius * 0.05, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + eyeOffsetX, eyeY, radius * 0.05, 0, Math.PI*2); ctx.fill();
    }

    // boca
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    if (isMonster) {
      // boca rasgada sombria
      ctx.moveTo(cx - radius * 0.35, cy + radius * 0.45);
      ctx.quadraticCurveTo(cx, cy + radius * 0.65, cx + radius * 0.35, cy + radius * 0.45);
    } else {
      ctx.arc(cx, cy + radius * 0.3, radius * 0.22, 0.15 * Math.PI, 0.85 * Math.PI);
    }
    ctx.stroke();

    // orelhas
    ctx.fillStyle = bodyColor;
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx - radius * 0.75, cy - radius * 0.75, radius * 0.22, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx + radius * 0.75, cy - radius * 0.75, radius * 0.22, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();

    // antena
    ctx.strokeStyle = isMonster ? '#333' : '#ddd';
    ctx.fillStyle = isMonster ? '#333' : '#ddd';
    ctx.lineWidth = 3;
    const antY = cy - radius - 2;
    if (antenna === 'triangle') {
      ctx.beginPath();
      ctx.moveTo(cx, antY - radius * 0.9);
      ctx.lineTo(cx - radius * 0.45, antY);
      ctx.lineTo(cx + radius * 0.45, antY);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
    } else if (antenna === 'circle') {
      ctx.beginPath();
      ctx.arc(cx, antY - radius * 0.5, radius * 0.42, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.moveTo(cx, antY);
      ctx.lineTo(cx, antY - radius * 1.0);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, antY - radius * 1.1, radius * 0.1, 0, Math.PI*2);
      ctx.fill();
    }

    // contorno extra de terror pro monstro
    if (isMonster) {
      ctx.strokeStyle = 'rgba(255,0,0,0.35)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(cx, cy, radius + 3, 0, Math.PI * 2);
      ctx.stroke();
    }
  }

  function drawEntities() {
    // Monstro (desenhado primeiro — atrás)
    drawTeletubby(
      monster.px, monster.py, monster.radius,
      '#555', 'triangle', true, true, 'down'
    );

    // Player (por cima)
    drawTeletubby(
      player.px, player.py, player.radius,
      avatar.bodyColor, avatar.antenna, false, false, player.facing
    );
  }

  function drawVinette() {
    const g = ctx.createRadialGradient(
      canvas.width/2, canvas.height/2, canvas.width * 0.25,
      canvas.width/2, canvas.height/2, canvas.width * 0.75
    );
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function render() {
    drawMap();
    drawEntities();
    drawVinette();
  }

  /* =========================================================
     Loop principal
     ========================================================= */
  function loop(timestamp) {
    if (state !== 'playing' && state !== 'gameover' && state !== 'win') return;

    const dt = Math.min(50, timestamp - lastTime || 16);
    lastTime = timestamp;
    animTime = timestamp;

    if (state === 'playing') {
      updatePlayer(dt);
      updateMonster(dt);
    }

    render();

    if (state === 'playing' || state === 'gameover' || state === 'win') {
      requestAnimationFrame(loop);
    }
  }

  /* =========================================================
     Game Over / Win
     ========================================================= */
  function triggerGameOver() {
    if (state !== 'playing') return;
    state = 'gameover';

    // jumpscare flash
    jumpscareEl.classList.add('flash');
    setTimeout(() => jumpscareEl.classList.remove('flash'), 120);
    setTimeout(() => {
      jumpscareEl.classList.add('flash');
      setTimeout(() => jumpscareEl.classList.remove('flash'), 80);
    }, 200);

    // para render loop após um instante
    setTimeout(() => {
      resultOverlay.className = 'overlay lose show';
      resultTitle.textContent = 'VOCÊ MORREU';
      resultMsg.textContent = 'O Slendytubby te encontrou... Você perdeu os Custards coletados nesta corrida.';
      resultReward.textContent = '';
    }, 700);
  }

  function triggerWin() {
    if (state !== 'playing') return;
    state = 'win';

    // adiciona recompensa REAL ao saldo do jogador
    const reward = player.collected;
    if (reward > 0) {
      Core.addCustards(reward);
    }

    setTimeout(() => {
      resultOverlay.className = 'overlay win show';
      resultTitle.textContent = 'VOCÊ VENCEU!';
      resultMsg.textContent = 'Todos os cremes foram coletados. Bom trabalho, sobrevivente.';
      resultReward.textContent = '+' + reward + ' Custards salvos na sua conta!';
    }, 500);
  }

  resultBtn.addEventListener('click', () => {
    window.location.href = 'index.html';
  });

  // Redimensionamento responsivo (recalcula sem mudar grid, apenas escala visual)
  window.addEventListener('resize', () => {
    const maxSide = Math.min(window.innerWidth, window.innerHeight) * 0.92;
    const newCanvasDisplay = Math.min(maxSide, 900);
    canvas.style.width = newCanvasDisplay + 'px';
    canvas.style.height = newCanvasDisplay + 'px';
  });
  // dispara uma vez para ajustar
  window.dispatchEvent(new Event('resize'));

  /* =========================================================
     Render inicial (tela "waiting")
     ========================================================= */
  (function initialRender() {
    drawMap();
    drawEntities();
    drawVinette();
  })();
})();
</script>
</body>
</html>
